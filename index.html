<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIOLET 서술형 · 수리고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deepest:#4D2D7A; --deep:#804CAD; --mid:#C698E0; --soft:#F5EAFA;
    --gold:#C4955A; --ink:#2B2240; --line:#DCCDED; --boxbg:#F8F5FC; --paper:#EDE6F4;
    --wrong-bg:#FBF1F1; --wrong-border:#E7C9C9; --wrong-ink:#9B4B4B;
    --ok-bg:#F0F7F0; --ok-border:#C8E0C8; --ok-ink:#3E7A45;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Noto Sans KR',sans-serif; color:var(--ink); background:var(--paper);
    word-break:keep-all; line-height:1.6; -webkit-font-smoothing:antialiased; font-style:normal;
  }
  em,i{font-style:normal;}
  .wrap{max-width:800px;margin:0 auto;padding:20px 16px 100px;}
  .sheet{background:#fff;border-radius:16px;padding:22px 22px 20px;position:relative;box-shadow:0 6px 28px rgba(77,45,122,.14);overflow:hidden;}

  /* phead */
  .phead{border-top:4px solid var(--deep);padding-top:11px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
  .pleft{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;letter-spacing:3px;color:var(--deepest);line-height:1;}
  .pcenter{text-align:center;flex:1;}
  .pcenter .t1{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;letter-spacing:5px;color:var(--deep);}
  .pcenter .t2{font-size:10.5px;color:var(--gold);letter-spacing:1px;margin-top:2px;}
  .pright{text-align:right;font-size:10.5px;color:#7A6E92;line-height:1.45;white-space:nowrap;}
  .pright b{color:var(--deepest);}
  .goldline{height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:6px 0 16px;}

  /* set tabs */
  .set-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .set-tab{font-size:12.5px;font-weight:600;color:#8B7DA6;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 13px;cursor:pointer;transition:all .15s;}
  .set-tab:hover{border-color:var(--mid);color:var(--deep);}
  .set-tab.active{background:var(--soft);border-color:var(--deep);color:var(--deepest);font-weight:700;}
  .set-tab.done::after{content:"✓";margin-left:5px;color:var(--ok-ink);font-weight:800;}
  .prob-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px dashed var(--line);}
  .nav-chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:#8B7DA6;border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
  .nav-chip:hover{border-color:var(--mid);color:var(--deep);}
  .nav-chip.active{background:var(--deep);border-color:var(--deep);color:#fff;}
  .nav-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .nav-chip.solved .dot{background:var(--ok-ink);}
  .nav-chip.opened .dot{background:var(--gold);}
  .nav-chip.active .dot{background:#EAD9F5;}
  .nav-num{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:15px;}
  .kkam-btn{margin-left:auto;border:1.5px solid var(--gold);background:#FFFDF6;color:#8a6a2e;border-radius:10px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .kkam-btn:disabled{opacity:.45;cursor:default;}
  .kkam-btn.ready{background:var(--gold);color:#fff;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,149,90,.4);}50%{box-shadow:0 0 0 6px rgba(196,149,90,0);}}

  /* qitem */
  .qitem{border:1px solid var(--line);border-radius:12px;padding:16px 17px 15px;background:#fff;margin-bottom:16px;}
  .qhead{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap;}
  .qno{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;color:var(--deep);line-height:1;min-width:34px;}
  .qno small{font-size:11px;color:var(--gold);letter-spacing:1px;display:block;font-family:'Noto Sans KR';font-weight:700;}
  .qpoint{background:var(--gold);color:#fff;font-size:11px;font-weight:700;letter-spacing:.03em;padding:4px 11px;border-radius:20px;}
  .qinstr{font-size:14px;font-weight:600;color:var(--deepest);margin-bottom:11px;}
  .qpassage{background:var(--boxbg);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin:8px 0 14px;font-size:16px;line-height:1.8;text-align:justify;font-family:'Cormorant Garamond',serif;font-weight:600;color:#332A45;}
  .qpassage .lead{padding-left:.3em;}
  .blank{display:inline-block;color:var(--deep);font-weight:700;text-align:center;border-bottom:2px solid var(--mid);min-width:2.4em;max-width:100%;vertical-align:baseline;margin:0 2px;line-height:1.5;}
  .ulined{border-bottom:2px solid var(--gold);padding-bottom:1px;}
  .summary-label{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 6px;}
  .qsummary{background:#FFFDF6;border:1px solid #E9D8B4;border-left:4px solid var(--gold);border-radius:10px;padding:13px 15px;font-size:15.5px;line-height:1.8;font-family:'Cormorant Garamond',serif;font-weight:600;color:#3a2f18;text-align:left;}
  .sub-label{font-size:11px;font-weight:700;color:#9485AE;letter-spacing:.05em;text-transform:uppercase;margin:14px 0 7px;}

  /* word bank (interactive) */
  .bank{display:flex;gap:8px;flex-wrap:wrap;}
  .bank .w{
    background:var(--soft);border:1px solid var(--line);color:var(--deepest);border-radius:9px;
    padding:8px 13px;font-size:15px;font-weight:600;font-family:'Cormorant Garamond',serif;
    cursor:pointer;user-select:none;transition:all .12s;
  }
  .bank .w:active{transform:scale(.94);}
  .bank .w.used{background:#F0EDF4;color:#B7ABC6;border-color:#E7E0EE;text-decoration:line-through;text-decoration-color:#C9BBDA;}
  .cond{font-size:13.5px;color:var(--ink);}
  .cond ul{list-style:none;margin:6px 0 0;}
  .cond li{position:relative;padding-left:16px;margin-bottom:4px;}
  .cond li::before{content:"·";position:absolute;left:4px;color:var(--deep);font-weight:800;}
  .cond b{color:var(--deep);font-weight:700;}

  /* answer builder (notezone) */
  .notezone{position:relative;margin-top:20px;border:1.5px solid var(--line);border-radius:14px;background:radial-gradient(var(--line) 1px, transparent 1px);background-size:17px 17px;background-color:#FCFAFE;padding:16px 16px 14px;}
  .note-label{display:inline-block;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:13px;letter-spacing:2px;color:var(--deep);background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 12px;margin-bottom:12px;}
  .note-label span{font-family:'Noto Sans KR';font-weight:700;font-size:11px;letter-spacing:0;color:#9485AE;}
  .answer-strip{
    min-height:56px;background:rgba(255,255,255,.94);border:1.5px solid var(--line);border-radius:11px;
    padding:10px 11px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  }
  .answer-strip.empty::before{content:"보기 단어를 눌러 여기에 배치하세요";color:#B3A6C6;font-family:'Noto Sans KR';font-weight:400;font-size:13.5px;}
  .tok{
    position:relative;background:#fff;border:1.5px solid var(--deep);color:var(--deepest);
    border-radius:9px;padding:7px 12px;font-size:15.5px;font-weight:600;font-family:'Cormorant Garamond',serif;
    cursor:pointer;user-select:none;transition:transform .1s;white-space:nowrap;
  }
  .tok:active{transform:scale(.95);}
  .tok.added{border-color:var(--gold);border-style:dashed;color:#8a6a2e;}
  .tok.changed{border-color:var(--ok-ink);}
  .tok .x{position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:#C99;color:#fff;font-size:11px;line-height:17px;text-align:center;font-family:'Noto Sans KR';opacity:0;transition:opacity .12s;}
  .tok:hover .x{opacity:1;}
  .tok-add{border:1.5px dashed var(--mid);color:var(--deep);background:#fff;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  .free-input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:16px;font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--ink);background:rgba(255,255,255,.94);}
  .free-input::placeholder{font-family:'Noto Sans KR';font-weight:400;font-size:14px;color:#B3A6C6;}
  .free-input:focus{outline:none;border-color:var(--deep);box-shadow:0 0 0 3px rgba(128,76,173,.12);}
  .builder-hint{font-size:11.5px;color:#9485AE;margin-top:9px;}
  .builder-hint b{color:var(--deep);}
  .row{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  button.submit{background:var(--deep);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:14.5px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;transition:background .15s;}
  button.submit:hover{background:var(--deepest);}
  button.submit:disabled{background:#C9BED6;}
  .try-count{font-size:12.5px;color:#7A6E92;}
  .try-count b{color:var(--deep);font-family:'Cormorant Garamond',serif;font-size:15px;}
  .note-coffee{position:absolute;bottom:8px;right:12px;width:50px;opacity:.9;pointer-events:none;}

  /* transform / input popup */
  .pop-mask{position:fixed;inset:0;background:rgba(43,34,64,.34);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
  .pop{background:#fff;border-radius:16px;padding:18px 18px 16px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(77,45,122,.3);animation:pop .2s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:none;}}
  .pop h4{font-size:13px;color:var(--deep);font-weight:700;margin-bottom:3px;}
  .pop .base{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;color:var(--deepest);margin-bottom:12px;}
  .pop-forms{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .pop-forms .f{background:var(--soft);border:1.5px solid var(--line);color:var(--deepest);border-radius:9px;padding:9px 13px;font-size:15.5px;font-weight:600;font-family:'Cormorant Garamond',serif;cursor:pointer;}
  .pop-forms .f:active{transform:scale(.95);}
  .pop-direct{display:flex;gap:8px;align-items:center;}
  .pop-direct input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15.5px;font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--ink);}
  .pop-direct input:focus{outline:none;border-color:var(--deep);}
  .pop-direct button{background:var(--deep);color:#fff;border:none;border-radius:9px;padding:10px 15px;font-size:13.5px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  .pop-actions{display:flex;justify-content:space-between;margin-top:12px;}
  .pop-actions .rm{background:none;border:none;color:var(--wrong-ink);font-size:12.5px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  .pop-actions .cl{background:none;border:none;color:#9485AE;font-size:12.5px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  .pop-tip{font-size:11px;color:#9485AE;margin-top:4px;}

  /* attempts log */
  .log-title{font-size:11.5px;font-weight:700;color:#9485AE;letter-spacing:.05em;margin:22px 0 10px;text-transform:uppercase;}
  .attempt{border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:10px;background:#fff;animation:pop .28s ease;}
  .attempt.wrong{background:var(--wrong-bg);border-color:var(--wrong-border);}
  .attempt.correct{background:var(--ok-bg);border-color:var(--ok-border);}
  .attempt-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;font-weight:700;}
  .try-badge{background:var(--mid);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;font-family:'Cormorant Garamond',serif;letter-spacing:.5px;}
  .attempt.wrong .try-badge{background:#C99;}
  .attempt.correct .try-badge{background:var(--ok-ink);}
  .verdict{font-size:12px;}
  .attempt.wrong .verdict{color:var(--wrong-ink);}
  .attempt.correct .verdict{color:var(--ok-ink);}
  .attempt-answer{font-size:15.5px;padding-left:.3em;color:var(--ink);font-family:'Cormorant Garamond',serif;font-weight:600;}
  .attempt-note{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:#7A6E92;}

  /* hint */
  .hintbox{position:relative;background:linear-gradient(180deg,#FFFDF6,#FDF7EA);border:1px solid #E9D8B4;border-left:4px solid var(--gold);border-radius:10px;padding:12px 15px;margin:14px 0;font-size:13.5px;animation:pop .3s ease;}
  .hintbox b{color:var(--gold);}
  .hint-peek{position:absolute;top:-40px;right:14px;width:76px;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(77,45,122,.18));}

  /* 오둥이 반응 */
  .reaction{display:flex;align-items:center;gap:12px;margin-top:16px;min-height:64px;}
  .reaction img{width:66px;height:auto;filter:drop-shadow(0 3px 5px rgba(77,45,122,.16));animation:bob .5s ease;}
  @keyframes bob{from{transform:translateY(8px) scale(.9);opacity:0;}to{transform:none;opacity:1;}}
  .bubble{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 14px;font-size:13.5px;color:var(--ink);font-weight:500;max-width:520px;}
  .bubble::before{content:"";position:absolute;left:-8px;top:22px;width:14px;height:14px;background:#fff;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg);}
  .bubble b{color:var(--deep);}

  /* reveal */
  .reveal{margin-top:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;animation:pop .35s ease;}
  .reveal-head{background:var(--deepest);color:#fff;padding:11px 18px;font-size:13px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:10px;}
  .reveal-head img{width:40px;height:auto;}
  .reveal-body{padding:18px 20px;background:#fff;}
  .gist{font-size:13.5px;color:var(--deep);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:15px;}
  .gist b{color:var(--deepest);}
  .model-ans{background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:10px;padding:13px 15px;margin-bottom:6px;font-size:16.5px;padding-left:.3em;font-family:'Cormorant Garamond',serif;font-weight:600;color:#2f4a33;}
  .model-ko{font-size:13px;color:#7A6E92;margin:0 0 16px 2px;}
  .sol-label{font-size:11.5px;font-weight:700;color:var(--deep);letter-spacing:.04em;margin:14px 0 6px;text-transform:uppercase;}
  .sol-body{font-size:14px;color:var(--ink);}
  .sol-body p{margin:0 0 9px;}
  .sol-body .pt{color:var(--deep);font-weight:700;}
  .sol-body .lab{display:inline-block;background:var(--soft);border:1px solid var(--line);color:var(--deepest);font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:5px;}
  .next-row{display:flex;justify-content:flex-end;margin-top:16px;}
  button.nextbtn{background:#fff;color:var(--deep);border:1.5px solid var(--line);border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  button.nextbtn:hover{border-color:var(--deep);background:var(--soft);}

  /* pfoot */
  .pfoot{display:flex;justify-content:space-between;font-size:10px;color:#9485AE;border-top:1px solid var(--line);padding-top:9px;margin-top:20px;}
  .pfoot .serif{letter-spacing:2px;color:var(--deep);}
  .foot-note{margin-top:16px;font-size:11px;color:#9485AE;text-align:center;line-height:1.7;}
  .reset-link{color:var(--deep);font-weight:700;text-decoration:underline;cursor:pointer;}
  .resume-toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-24px);opacity:0;transition:all .35s ease;z-index:80;background:var(--deepest);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:22px;box-shadow:0 6px 20px rgba(77,45,122,.35);white-space:nowrap;}
  .resume-toast.show{opacity:1;transform:translate(-50%,0);}
  .resume-toast b{color:#EAD9F5;}

  /* ===== 깜지(handwriting) ===== */
  .kkam-wrap{}
  .kkam-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .kkam-head .t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;letter-spacing:2px;color:var(--deepest);}
  .kkam-sub{font-size:12.5px;color:#7A6E92;margin-bottom:14px;}
  .kkam-name{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .kkam-name label{font-size:12.5px;font-weight:700;color:var(--deep);}
  .kkam-name input{border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;font-family:'Noto Sans KR';color:var(--ink);}
  .kkam-name input:focus{outline:none;border-color:var(--deep);}
  .kkam-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;background:#fff;}
  .kkam-ref{background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:9px;padding:10px 13px;margin-bottom:6px;}
  .kkam-ref .en{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:16px;color:#2f4a33;padding-left:.3em;}
  .kkam-ref .ko{font-size:12.5px;color:#5c6b5e;margin-top:3px;}
  .kkam-instr{font-size:12px;color:#9485AE;margin:9px 0 8px;}
  .kkam-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .kkam-toolbar button{border:1.5px solid var(--line);background:#fff;color:var(--deep);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  .kkam-toolbar button.on{background:var(--deep);color:#fff;border-color:var(--deep);}
  .kkam-toolbar .sp{margin-left:auto;font-size:11.5px;color:#9485AE;}
  .canvas-box{position:relative;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;touch-action:none;}
  .canvas-box canvas{display:block;width:100%;touch-action:none;}
  .kkam-done{display:flex;gap:12px;justify-content:center;margin-top:8px;}
  button.big{background:var(--deep);color:#fff;border:none;border-radius:12px;padding:14px 30px;font-size:15px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  button.big.ghost{background:#fff;color:var(--deep);border:1.5px solid var(--line);}

  /* completion card */
  .comp-card{border:2px solid var(--deep);border-radius:16px;padding:22px;background:linear-gradient(180deg,#fff,#FBF7FE);text-align:center;}
  .comp-stamp{display:inline-block;transform:rotate(-8deg);border:3px solid var(--gold);color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;letter-spacing:2px;padding:6px 18px;border-radius:10px;margin-bottom:14px;}
  .comp-line{font-size:14px;color:var(--ink);margin:4px 0;}
  .comp-line b{color:var(--deepest);}
  .comp-thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  .comp-thumbs img{width:120px;border:1px solid var(--line);border-radius:8px;}
  .comp-shot{font-size:12.5px;color:var(--deep);font-weight:700;background:var(--soft);border:1px dashed var(--mid);border-radius:10px;padding:10px;margin-top:12px;}
  .comp-mascot{width:70px;margin:0 auto 6px;display:block;}
</style>
</head>
<body>
<div class="wrap">
 <div class="sheet">
  <div class="phead">
    <div class="pleft">OASIS</div>
    <div class="pcenter">
      <div class="t1">VIOLET SYNTAX</div>
      <div class="t2">서술형 · 다시 쓰기 연습 · Daily Writing</div>
    </div>
    <div class="pright"><b>강선종 선생님</b><br>수리고 서술형</div>
  </div>
  <div class="goldline"></div>
  <div class="set-tabs" id="setTabs"></div>
  <div class="prob-row" id="probRow"></div>
  <div id="stage" style="margin-top:18px"></div>
