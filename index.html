const PROBLEMS = [{"id": 1, "unit": "가주어 진주어", "point": "가주어-진주어", "instr": "다음 글의 내용을 요약하고자 한다. &lt;보기&gt;에 주어진 표현만을 모두 한 번씩 사용하여 문맥과 어법에 맞게 빈칸을 완성하시오. (단, 필요시 어법에 맞게 단어의 형태를 변형할 것.)", "passage": "<span class=\"lead\">Many</span> coaches are very good at giving information that is high in content, for instance, when introducing new tactics or technical skills. However, players may “switch off,” become bored, confused and even frustrated if too much instruction is given. Furthermore, when coaches continually use verbal instruction, they become the main actors in the coaching theater thereby limiting or stopping the active participation of the players. Therefore, by involving the players through asking questions and listening to them, a coach obliges them to think, collect information, evaluate and create. This involves and encourages players to take more responsibility for their own learning and development.", "summary": "According to the passage, <span class=\"blank\" style=\"width:30em\">&nbsp;</span>.", "bank": ["communication", "it is", "how", "verbal", "in", "consider", "important", "convey", "to", "be", "content"], "conds": [], "gist": "코치는 선수들이 스스로 생각하고 학습할 수 있도록 질문하고 듣는 방식으로 적극적으로 참여시키는 것이 중요하다.", "answer": "in verbal communication, it is important to consider how content is conveyed.", "answerKo": "언어적 의사소통에서 내용이 어떻게 전달되는지를 고려하는 것은 중요하다.", "accept": ["in verbal communication, it is important to consider how content is conveyed", "it is important to consider how content is conveyed in verbal communication"], "checkChunks": ["it is important", "to consider", "how content is conveyed", "in verbal communication"], "hints": {"3": "보기의 it is, important, to를 보고 가주어-진주어 구문 [it + be동사 + 형용사 + to부정사]을 떠올리세요.", "4": "it is important to consider ~ 형태로 잡고, consider의 목적어로 how 의문사절을 만드세요. be를 is로, convey를 수동태 is conveyed로 변형합니다. 맨 앞에는 in verbal communication을 둡니다.", "5": "<b>in verbal communication</b>, <b>it</b> <b>is</b> <b>important</b> <b>to consider</b> <b>how</b> <b>content</b> <b>is conveyed</b>."}, "sol": [["뼈대 잡기", "보기에 <b>it is</b>, <b>important</b>, <b>to</b>가 보이면 먼저 <span class=\"pt\">가주어-진주어</span>를 떠올린다. 대표 형태는 <span class=\"pt\">it + be동사 + 형용사 + to부정사</span>이고 '~하는 것은 …하다'라는 뜻이다."], ["왜 가주어를 쓰나", "진짜 주어는 <b>to consider how content is conveyed</b>인데 너무 길다. 그래서 자리만 채우는 가짜 주어 <b>it</b>을 앞에 두고 진짜 주어인 to부정사는 뒤로 보낸다."], ["how 절 만들기", "consider의 목적어 자리에는 의문사 how를 이용한 <span class=\"pt\">의문사절</span>이 온다. 의문사절은 <span class=\"pt\">의문사 + 주어 + 동사</span> 순서로 쓴다."]]}, {"id": 2, "unit": "가주어 진주어", "point": "가주어-진주어", "instr": "다음 글을 읽고, &lt;보기&gt;의 단어들을 모두 한 번씩만 그대로 사용하여 빈칸에 들어갈 말을 문맥과 어법에 맞게 완성하시오.", "passage": "<span class=\"lead\">In</span> 1824, Peru won its freedom from Spain. Soon after, Simón Bolívar, the general who had led the liberating forces, called a meeting to write the first version of the constitution for the new country.  After the meeting, the people wanted to do something special for Bolívar to show their appreciation for all he had done for them, so they offered him a gift of one million pesos, a very large amount of money in those days. Bolívar accepted the gift and then asked, “How many slaves are there in Peru?” He was told there were about three thousand. “And how much does a slave sell for?” he wanted to know. “About 350 pesos for a man,” was the answer. “Then,” said Bolívar, “I’ll add whatever is necessary to this million pesos you have given me and I will buy all the slaves in Peru and set them free.” Emphasizing that all citizens should be free, he continued, “<span class=\"blank\" style=\"width:30em\">&nbsp;</span>.”", "bank": ["freedom", "no sense", "a nation", "unless", "all its citizens", "enjoy", "to free", "it", "makes"], "conds": [], "gist": "시몬 볼리바르는 페루의 독립을 축하하며 받은 보상금으로 모든 노예를 사서 자유를 선사하려 했다.", "answer": "it makes no sense to free a nation unless all its citizens enjoy freedom", "answerKo": "모든 국민이 자유를 누리지 않는 한 국가를 자유롭게 하는 것은 말이 되지 않는다.", "accept": ["it makes no sense to free a nation unless all its citizens enjoy freedom"], "checkChunks": ["it makes no sense", "to free a nation", "unless", "all its citizens enjoy freedom"], "hints": {"3": "it과 to free를 보고 가주어-진주어 구문임을 파악하세요. make no sense는 '말이 되지 않다'입니다.", "4": "[it makes no sense to free a nation] 뒤에 조건절 unless를 붙입니다. unless 뒤에 [all its citizens enjoy freedom]을 배열하세요.", "5": "<b>it</b> <b>makes</b> <b>no sense</b> <b>to free</b> <b>a nation</b> <b>unless</b> <b>all its citizens</b> <b>enjoy</b> <b>freedom</b>."}, "sol": [["표현 정리", "<b>make no sense</b>는 '말이 되지 않다, 타당하지 않다'라는 뜻이다."], ["뼈대 잡기", "이 문장은 형용사가 들어간 전형적인 형태는 아니지만, <b>it</b>과 <b>to free</b>라는 to부정사 형태를 보고 <span class=\"pt\">가주어-진주어</span> 구문임을 파악한다."], ["왜 가주어를 쓰나", "진짜 주어는 <b>to free a nation</b>인데 길기 때문에, 가짜 주어 <b>it</b>을 앞에 두고 진짜 주어는 뒤로 보낸다."], ["정리", "가주어-진주어 구문은 <span class=\"pt\">it + be동사 + 형용사 + to부정사</span>라는 전형적인 형태가 아니어도 성립할 수 있다."]]}, {"id": 3, "unit": "가주어 진주어", "point": "가주어-진주어 · judge A as B", "instr": "다음 글을 읽고, 밑줄 친 (A), (B)에 주어진 표현만을 모두 각각 한 번씩 그대로 사용하여 주어진 글과 내용이 일치하도록 알맞은 문장을 완성하시오.", "passage": "<span class=\"lead\">The</span> availability heuristic refers to a common mistake that our brains make by assuming that the instances or examples that come to mind easily are also the most important or prevalent. It shows that we make our decisions based on the recency of events. We often misjudge the frequency and magnitude of the events that have happened recently because of the limitations of our memories. According to Harvard professor, Max Bazerman, managers conducting performance appraisals often fall victim to the availability heuristic. The recency of events highly influences a supervisor’s opinion during performance appraisals. Managers give more weight to performance during the three months prior to the evaluation than to the previous nine months of the evaluation period because the recent instances dominate their memories. The availability heuristic is influenced by the ease of recall or retrievability of information of some event. Ease of recall suggests that if something is more easily recalled in your memory, you think that it will occur with a high probability.", "summary": "The availability heuristic involves making decisions based upon how <span class=\"blank\" style=\"width:19em\">(A)</span>. Since these are more readily available in your memory, you <span class=\"blank\" style=\"width:27em\">(B)</span>.", "bank": ["bring", "to", "some things", "is", "to", "easy", "mind", "it", "common", "as", "probably", "being", "more", "judge", "these outcomes", "will"], "conds": [], "gist": "가용성 휴리스틱은 최근 기억이 쉽게 떠오르는 사건에 과도한 비중을 두어 판단과 의사결정에 영향을 미친다는 것이다.", "answer": "(A) how easy it is to bring some things to mind.\n(B) you will probably judge these outcomes as being more common.", "answerKo": "(A) 몇 가지를 생각해내는 것이 얼마나 쉬운지 (B) 너는 이 결과들을 더 흔한 것으로 판단할 것이다.", "requireAll": ["easy it is to bring some things to mind", "will probably judge these outcomes as being more common"], "checkChunks": ["easy it is", "to bring some things to mind", "judge these outcomes", "as being more common"], "hints": {"3": "(A)는 it과 easy를 보고 가주어-진주어, (B)는 judge A as B 구문을 떠올리세요.", "4": "(A) how 뒤에 형용사 easy를 두고 [how easy it is to bring some things to mind]로 배열합니다. (B) judge these outcomes as being more common 순으로 배열하고 앞에 will을 둡니다.", "5": "(A) <b>how easy</b> <b>it is</b> <b>to bring</b> <b>some things</b> <b>to mind</b> / (B) <b>will probably</b> <b>judge</b> <b>these outcomes</b> <b>as being</b> <b>more common</b>."}, "sol": [["(A) 뼈대 잡기", "<b>it</b>과 <b>easy</b>를 보고 <span class=\"pt\">가주어-진주어</span> 구문임을 파악한다. 진짜 주어는 <b>to bring some things to mind</b>인데 길기 때문에, 가짜 주어 <b>it</b>을 앞에 두고 진짜 주어는 뒤로 보낸다."], ["(A) 어순", "이 절은 의문사 how가 이끄는 절이다. how 뒤에 형용사·부사가 붙을 때는 <span class=\"pt\">의문사 + 형용사/부사 + 주어 + 동사</span> 순서로 쓴다. 따라서 형용사 easy를 how 바로 뒤에 두어 <b>how easy it is …</b>로 배열한다."], ["(B) 핵심 문법", "<span class=\"pt\">judge A as B</span>(A를 B로 판단하다) 구문이 쓰였다. as 뒤 B에는 명사 형태가 와야 하므로 동명사 <b>being</b>과 <b>these outcomes</b>를 명사 자리에 맞추어 배열한다."]]}, {"id": 4, "unit": "가목적어", "point": "가목적어 make it + 형용사 + to부정사", "instr": "다음 글의 내용을 아래와 같이 정리하고자 한다. &lt;보기&gt;의 단어들을 모두 한 번씩만 그대로 사용하여 빈칸 (A), (B)에 들어갈 말을 문맥과 어법에 맞게 완성하시오.", "passage": "<span class=\"lead\">As</span> we grow older, the eye lens becomes more yellow, causing poorer color discrimination in the green-blue-violet end of the spectrum. Also, the lens’s ability to adjust and focus declines as the muscles around it stiffen. This is what causes difficulty in seeing close objects clearly (called presbyopia), necessitating either longer arms or corrective lenses. To complicate matters further, the time our eyes need to change focus from near to far (or vice versa) increases. This also poses a major problem in driving. Because drivers are constantly changing their focus from the instrument panel to other autos and signs on the highway, older drivers may miss important information because of their slower refocusing time.", "summary": "&lt;Problems caused by presbyopia&gt; 1. Presbyopia causes <span class=\"blank\" style=\"width:20em\">(A)</span>. 2. Presbyopia makes <span class=\"blank\" style=\"width:19em\">(B)</span>. 3. Presbyopia increases the time our eyes need to change focus.", "bank": ["it", "discriminating", "difficulty", "difficult", "in", "some colors", "close objects", "to perceive"], "conds": [], "gist": "나이가 들면서 눈의 렌즈가 노화되어 색 구별 능력과 초점 전환 속도가 저하되어 시력 문제와 운전에 어려움을 초래한다.", "answer": "(A) difficulty in discriminating some colors.\n(B) it difficult to perceive close objects.", "answerKo": "(A) 일부 색상을 구별하는 데 어려움을 야기한다. (B) 가까운 물체들을 인지하는데 어렵게 한다.", "requireAll": ["difficulty in discriminating some colors", "it difficult to perceive close objects"], "checkChunks": ["difficulty in discriminating some colors", "it difficult", "to perceive close objects"], "hints": {"3": "(A)는 difficulty in v-ing, (B)는 가목적어 [make + it + 형용사 + to부정사]를 떠올리세요.", "4": "(A) 전치사 in 뒤라 discriminate를 discriminating으로 바꿔 [difficulty in discriminating some colors]. (B) [it difficult to perceive close objects]로 가목적어 it을 앞에 둡니다.", "5": "(A) <b>difficulty</b> <b>in discriminating</b> <b>some colors</b> / (B) <b>it</b> <b>difficult</b> <b>to perceive</b> <b>close objects</b>."}, "sol": [["(A) 핵심 문법", "<span class=\"pt\">difficulty in v-ing/명사</span>는 '~하는 데에 어려움'이라는 뜻이다. 전치사 in 뒤에는 명사 형태가 와야 하므로 동사 discriminate를 동명사 <b>discriminating</b>으로 바꿔 쓴다."], ["(B) 핵심 문법", "<span class=\"pt\">make + it + 형용사 + to부정사</span> 구조가 쓰였다. 여기서 <b>it</b>은 가목적어다."], ["가목적어란", "가목적어는 목적어가 길 때 자리만 채우는 가짜 목적어 <b>it</b>이다. 진짜 목적어인 to부정사는 뒤로 보낸다. 주로 make, believe, consider, think, suppose, find 같은 동사와 함께 쓰인다."], ["왜 이렇게?", "(B)부분에 동사 make가 있고 <b>it</b>과 <b>to perceive</b>가 보인다. 이를 근거로 (B)부분 전체를 가목적어 구조로 잡는다."]]}, {"id": 5, "unit": "가목적어", "point": "가목적어 make it + 형용사 + to부정사 · 분사구문", "instr": "다음 글의 요지를 한 문장으로 표현하고자 한다. 밑줄 친 빈칸을 주어진 &lt;조건&gt;에 맞게 작성하시오.", "passage": "<span class=\"lead\">Gender</span> research shows a complex relationship gender and conflict styles. Some research suggests that women from Western cultures tend to be more caring than men. This tendency may result from socialization processes in which women are encouraged to care for their families and men are encouraged to be successful in competitive work environments. However, we live in a society where gender roles and boundaries are not as strict as in prior generations. There is significant variability in assertiveness and cooperation among women, as well as among men. Although conflict resolution experts should be able to recognize cultural and gender differences, they should also be aware of within-group variations and the risks of stereotyping. Culture and gender may affect the way people perceive, interpret, and respond to conflict; however, we must be careful to avoid overgeneralizations and to consider individual differences.", "summary": "Gender and culture can influence conflict styles, but modern society shows significant individual variation, <span class=\"blank\" style=\"width:30em\">&nbsp;</span> in conflict resolution.", "bank": ["and", "consideration", "differences", "it", "important", "make", "personal", "stereotypes", "to avoid"], "conds": ["아래 주어진 단어만을 모두 한 번씩만 사용하되, 필요시 문맥과 어법에 맞게 형태를 바꿀 것."], "gist": "성별과 문화가 갈등 해결 방식에 영향을 미칠 수 있지만, 개별적인 차이와 고정관념의 위험성을 고려하는 것이 중요하다.", "answer": "making it important to avoid stereotypes and consider personal differences", "answerKo": "고정관념을 피하고 개인적인 차이를 고려하는 것이 중요함.", "accept": ["making it important to avoid stereotypes and consider personal differences", "making it important to consider personal differences and avoid stereotypes"], "checkChunks": ["making it important", "to avoid stereotypes", "consider personal differences"], "hints": {"3": "앞 문장이 완전하고 연결사가 없으니 [, v-ing] 분사구문으로 이어 붙이고, make의 가목적어 it을 활용하세요.", "4": "make를 making으로 바꾸고 [making it important to avoid stereotypes and consider personal differences]로 배열합니다. consideration은 consider로 변형합니다.", "5": "<b>making</b> <b>it important</b> <b>to avoid</b> <b>stereotypes</b> <b>and</b> <b>consider</b> <b>personal</b> <b>differences</b>."}, "sol": [["뼈대 잡기", "빈칸 앞 문장은 이미 완전한 문장이고 연결사가 없다. 그래서 연결사 없이 이어 붙이려면 <span class=\"pt\">, v-ing</span> 형태의 분사구문을 쓴다."], ["가목적어", "<span class=\"pt\">make + 가목적어 it + 형용사 + to부정사</span> 구조가 쓰였다. 가목적어는 자리만 채우는 가짜 목적어 <b>it</b>이고, 진짜 목적어인 to부정사는 뒤로 보낸다."], ["배열", "<b>making it important to avoid stereotypes and (to) consider personal differences</b> 형태가 된다. to avoid …가 진목적어1, (to) consider …가 진목적어2다."], ["병렬구조", "진목적어 둘이 and로 연결된 병렬구조이므로 형태가 같아야 한다. 앞이 to부정사(to avoid)이므로 뒤도 to부정사나 동사원형(consider) 형태로 맞춘다."]]}, {"id": 6, "unit": "관계대명사", "point": "주격 관계대명사 who · let A 동사원형", "instr": "다음 글의 요지를 한 문장으로 표현하고자 한다. 빈칸 (A), (B)를 주어진 조건에 맞게 작성하시오.", "passage": "<span class=\"lead\">Your</span> parents may be afraid that you will not spend your allowance wisely. You may make some foolish spending choices, but if you do, the decision to do so is your own and hopefully you will learn from your mistakes. Much of learning occurs through trial and error. Explain to your parents that money is something you will have to deal with for the rest of your life. It is better that you make your mistakes early on rather than later in life. Explain that you will have a family someday and you need to know how to manage your money. Not everything is taught at school!", "summary": "If your parents want you to <span class=\"blank\" style=\"width:23em\">(A)</span> they should let you <span class=\"blank\" style=\"width:23em\">(B)</span>.", "bank": ["a person", "manage", "who", "become", "money", "proper", "the", "take ownership", "money", "make", "of", "your", "mistakes", "and"], "conds": ["(A) : 아래 주어진 표현만을 모두 한 번씩 사용하되, 필요시 문맥과 어법에 맞게 형태를 바꿀 것.", "(B) : 아래 주어진 표현만을 모두 한 번씩 그대로 사용할 것."], "gist": "용돈 관리 실수는 스스로 배우는 과정의 일부이며, 이를 통해 미래의 금전 관리 능력을 기를 수 있음을 부모에게 설명하라.", "answer": "(A) become a person who manages the money properly\n(B) take ownership of your money and make mistakes", "answerKo": "(A) 돈을 적절하게 관리하는 사람이 되다. (B) 당신의 돈에 대한 소유권을 가지고 실수한다.", "accept": ["become a person who properly manages the money take ownership of your money and make mistakes"], "requireAll": ["become a person who manages the money properly", "take ownership of your money and make mistakes"], "checkChunks": ["become a person who", "manages the money properly", "take ownership of your money", "make mistakes"], "hints": {"3": "(A)는 want + 목적어 + to부정사, 주격 관계대명사 who를, (B)는 let + 목적어 + 동사원형을 떠올리세요.", "4": "(A) become 뒤에 a person을 두고 who절로 수식, manage를 manages로 수일치, proper를 properly로 변형합니다. (B) 주어진 표현 그대로 [take ownership of your money and make mistakes].", "5": "(A) <b>become</b> <b>a person</b> <b>who</b> <b>manages</b> <b>the money</b> <b>properly</b> / (B) <b>take ownership</b> <b>of your money</b> <b>and</b> <b>make mistakes</b>."}, "sol": [["(A) 뼈대 잡기", "<span class=\"pt\">want + 목적어 + 목적격 보어</span> 구조다. want는 목적격 보어로 to부정사를 취하므로, 빈칸 앞 to에 이어 동사원형 <b>become</b>을 쓴다."], ["(A) 수일치", "주격 관계대명사 <b>who</b>가 쓰였다. 선행사가 a person(단수)이므로 관계대명사 뒤 동사 manage에 -s를 붙여 <b>manages</b>로 수일치시킨다."], ["(B) 표현 정리", "<span class=\"pt\">take ownership of</span>는 '~의 소유권을 가지다'라는 뜻이다."], ["(B) 핵심 문법", "<span class=\"pt\">let + 목적어 + 동사원형</span> 구문이 쓰였다. 따라서 (B)부분에는 동사원형 형태로 쓴다."]]}, {"id": 7, "unit": "관계대명사", "point": "주격 관계대명사 which · 수동태", "instr": "다음 글의 내용을 &lt;보기&gt;에 주어진 단어만을 한 번씩 모두 사용하여 한 문장으로 요약하시오. (단, 필요시 문맥과 어법에 맞게 어형을 변형할 것)", "passage": "<span class=\"lead\">As</span> one of many examples of complexity of motivationally anchored instruction, motivation is governed to a large extent by emotion. A person working at a task feels frustrated and stops. Another person working at a task feels joy and continues. But what brings out a response of frustration or joy may differ across cultures, because cultures differ in their definitions of novelty, hazard, opportunity, gratification, and. so forth. It is also quite possible for another person with a different set of cultural beliefs to feel frustrated at a task and yet continue with further determination. Depending on the cultural groups with which a person identifies, illness, for example, may be understood from the perspective of germs, God, anxiety, chance, or one's moral failure, and a person's emotional response to illness will reflect these beliefs. Cultural groups vary in their beliefs about the meaning of emotional experiences, expressions, and behaviors.", "summary": "Our emotional responses toward a certain circumstance may be <span class=\"blank\" style=\"width:30em\">&nbsp;</span>.", "bank": ["the cultural groups", "determine", "based", "our beliefs", "which", "are", "by", "on"], "conds": [], "gist": "동기와 감정은 문화적 신념과 정의에 따라 다르게 형성되며, 이는 행동과 감정적 반응에 큰 영향을 미친다.", "answer": "determined by the cultural groups which are based on our beliefs", "answerKo": "우리의 믿음에 기반한 문화적 그룹들에 의해서 결정된다.", "accept": ["determined by the cultural groups which are based on our beliefs"], "checkChunks": ["determined by the cultural groups", "which are based on our beliefs"], "hints": {"3": "may be 뒤이므로 수동태로 시작하고, 주격 관계대명사 which로 선행사를 수식하세요.", "4": "determine을 과거분사 determined로 바꿔 [determined by the cultural groups]를 만들고, which are based on our beliefs로 the cultural groups를 수식합니다.", "5": "<b>determined</b> <b>by the cultural groups</b> <b>which</b> <b>are</b> <b>based</b> <b>on</b> <b>our beliefs</b>."}, "sol": [["핵심 문법", "주격 관계대명사 <b>which</b>가 쓰였다. 보기의 <b>are</b>를 보고 선행사를 복수 명사 <span class=\"pt\">the cultural groups</span>로 잡는다."], ["수동태", "이 부분은 수동태 구조이므로 determine을 과거분사 형태 <b>determined</b>로 바꿔 쓴다."]]}, {"id": 8, "unit": "관계대명사", "point": "전치사+관계대명사 in which", "instr": "다음 글의 내용을 한 문장으로 요약하고자 한다. 주어진 &lt;조건&gt;에 맞게 빈칸 (A), (B)를 완성하시오.", "passage": "<span class=\"lead\">The</span> strategies and responses of human populations to massive outbreaks of disease have been remarkably similar. Because illness was so often attributed to divine providence, many societies developed ceremonies, sacrifices, and processions designed to appease the gods. In Christian communities one of the most common responses to the appearance of epidemic disease was the organization of religious processions during which clergy and laypeople removed the images of saints from their churches and carried them through the streets of the community, praying for divine mercy. During an epidemic in Paris in 1466, for example, thousands turned out to watch the remains of Saints Crepin and Crepinien being paraded through the streets. Ironically, bringing large numbers of people together for public gatherings actually facilitated the spread of contagious illnesses and may, in fact, have worsened epidemics in many cases.", "summary": "Owing to the <span class=\"blank\" style=\"width:28em\">(A)</span> divine mercy, <span class=\"blank\" style=\"width:22em\">(B)</span> in the past.", "bank": ["appeal", "gatherings", "massive", "people", "which", "for", "religion", "in", "of", "infect", "accelerate", "disease", "risk", "the"], "conds": ["1. (A): 아래 주어진 단어만을 모두 한 번씩 사용하여 완성하되, 필요시 문맥과 어법에 맞게 형태를 바꿀 것.", "2. (B): 아래 주어진 단어만을 모두 한 번씩 사용하여 완성하되, 필요시 문맥과 어법에 맞게 형태를 바꿀 것."], "gist": "과거 사람들은 전염병을 신의 뜻으로 여겨 종교 행사를 통해 진정을 구했지만, 이러한 집단 행위가 오히려 질병 확산을 악화시켰다.", "answer": "(A) massive religious gatherings in which people appealed for\n(B) the risk of infectious diseases accelerated", "answerKo": "(A) 사람들이 신의 자비를 간청했던 거대한 종교적 집회들 (B) 가속화되는 전염성 질병들의 위험성.", "requireAll": ["massive religious gatherings in which people appealed for", "the risk of infectious diseases accelerated"], "checkChunks": ["massive religious gatherings", "in which people appealed for", "the risk of infectious diseases", "accelerated"], "hints": {"3": "(A)는 owing to 뒤 명사구로, 전치사+관계대명사 in which를 사용하세요. (B)는 the risk of ~ 주어에 accelerated 동사.", "4": "(A) religion을 religious로 바꿔 [massive religious gatherings in which people appealed for]. (B) infect를 infectious로 바꿔 [the risk of infectious diseases accelerated].", "5": "(A) <b>massive</b> <b>religious</b> <b>gatherings</b> <b>in which</b> <b>people</b> <b>appealed</b> <b>for</b> / (B) <b>the risk</b> <b>of</b> <b>infectious</b> <b>diseases</b> <b>accelerated</b>."}, "sol": [["(A) 뼈대 잡기", "<span class=\"pt\">owing to + 명사</span>는 '~ 때문에'라는 뜻이다. owing to 뒤에는 명사가 와야 하므로 (A)부분 전체를 gatherings를 중심으로 한 명사구로 쓴다."], ["(A) 전치사+관계대명사", "<span class=\"pt\">in which</span>가 선행사 gatherings를 수식한다(= where). [전치사 + 관계대명사] 뒤에는 완전한 문장이 온다. 그래서 <b>people appealed for divine mercy</b>라는 완전한 절이 이어진다."], ["(B) 품사 바꾸기", "the risk of infectious diseases가 주어, accelerated가 동사다. diseases를 앞에서 꾸미려면 명사 infect를 형용사 <b>infectious</b>로 바꿔야 한다."]]}, {"id": 9, "unit": "의문사절", "point": "전치사 of + 의문사절 (how long)", "instr": "다음 글에서 필자가 주장하는 바를 한 문장으로 작성하고자 한다. &lt;보기&gt;에서 주어진 단어만을 모두 한 번씩만 사용하여 빈칸을 완성하시오. (단, 필요시 &lt;보기&gt;의 단어의 어형을 변형하시오.)", "passage": "<span class=\"lead\">In</span> an experiment, when people were asked to count three minutes in their heads, 25‒year‒olds were quite accurate, but 65‒year‒olds went over on average by 40 seconds. Time seemed to pass faster for the older group. This may seem meaningless, but there are a lot of benefits to perceiving time like 65‒year‒olds. For example, if you have been working on a project for eight hours, but it only feels like six, you will have more energy to keep going. If you have been running for 20 minutes, and you perceive it to be only 13 minutes, you’re more likely to have seven more minutes of energy.", "summary": "According to the experiment, you should <span class=\"blank\" style=\"width:28em\">&nbsp;</span> in order that you use your energy to work together.", "bank": ["work", "you", "perceive", "change", "of", "how", "be", "you", "long", "have"], "conds": [], "gist": "나이가 들수록 시간이 빨리 흐르는 듯한 인식은 더 많은 에너지를 가지고 작업이나 운동을 지속하는 데 유리하게 작용할 수 있다.", "answer": "change your perception of how long you have been working.", "answerKo": "너가 얼마나 오래 일했는지에 대한 인식을 바꾸다.", "accept": ["change your perception of how long you have been working"], "checkChunks": ["change your perception", "of how long", "you have been working"], "hints": {"3": "change의 목적어로 명사가 필요하다. 보기의 how에 주목해 목적어 자리에 '의문사절'을 만들어 보자.", "4": "전치사 of 뒤에는 명사가 와야 하므로 perceive를 명사형 perception으로 바꾼다. 그 뒤에 how long(얼마나 오래)+주어+동사를 잇는다.", "5": "<b>change</b> <b>your</b> <b>perception</b> <b>of</b> <b>how</b> <b>long</b> <b>you</b> <b>have</b> <b>been</b> <b>working</b>"}, "sol": [["뼈대 잡기", "change의 목적어로 명사가 필요하고, 보기에 how가 보이므로 <span class=\"pt\">의문사절</span>이 목적어로 쓰인다고 예측한다. 의문사절이란 <b>how, what, why</b> 같은 의문사가 이끄는 절로, 문장 안에서 명사 역할을 한다."], ["핵심 문법", "주어진 perceive(동사)를 그대로 쓸 수 없다. 전치사 of 뒤에는 반드시 명사가 와야 하므로, perceive를 명사형 <b>perception</b>으로 바꾸어 「perception of ~(에 대한 인식)」 형태를 만든다."], ["의문사절 어순", "의문사절은 「의문사+주어+동사」 또는 「의문사+형용사/부사+주어+동사」의 어순으로 쓴다. 이 문장에서는 뒤 형태를 쓴다."], ["배열", "change your perception of <b>how</b>(의문사) <b>long</b>(부사) you(주어) have been working(동사). 여기서 how long이 한 덩어리로 '얼마나 오래'를 뜻하며, 그 뒤에 주어+동사가 이어진다."]]}, {"id": 10, "unit": "의문사절", "point": "의문사절 (how+형용사) + 접속사 that", "instr": "다음 글을 읽고 &lt;보기&gt;에 주어진 단어만을 모두 한 번씩만 사용하여 빈칸에 들어갈 말을 문맥과 어법에 맞게 문장을 완성하시오.", "passage": "<span class=\"lead\">I</span> understand <span class=\"blank\" style=\"width:26em\">&nbsp;</span> our shipping office sent you the wrong order a few days ago. Please accept my sincere apologies for that error. After investigating what caused the mistake, I found that we have two H. Browns in our customer files; hence, the shipping office mistakenly sent you the other Mr. H. Brown’s order. To ensure that we do not repeat this error, we will always include full first names on all paperwork and double-check the account numbers. Again, I apologize for the inconvenience we caused you. We will give a 15% discount on your next order.", "bank": ["how", "you", "when", "been", "that", "have", "you discovered", "upset", "must"], "conds": [], "gist": "잘못된 주문 발송에 대해 사과하며, 실수를 방지하기 위해 개선 조치를 약속하고 다음 주문에 15% 할인을 제공한다.", "answer": "how upset you must have been when you discovered that", "answerKo": "그것을 알았을 때 당신이 얼마나 화가 났을지.", "accept": ["how upset you must have been when you discovered that"], "checkChunks": ["how upset", "you must have been", "when you discovered", "that"], "hints": {"3": "understand의 목적어로 명사가 필요하다. 보기의 how로 시작하는 '의문사절'을 목적어로 만들어 보자.", "4": "how 뒤에 형용사 upset을 붙여 how upset(얼마나 화가 난)을 만들고, discovered 뒤 완전한 문장은 접속사 that으로 연결한다.", "5": "<b>how</b> <b>upset</b> <b>you</b> <b>must</b> <b>have</b> <b>been</b> <b>when</b> <b>you discovered</b> <b>that</b>"}, "sol": [["뼈대 잡기", "understand의 목적어로 명사가 필요하고, 보기에 how가 있으므로 <span class=\"pt\">의문사절</span>이 목적어로 쓰인다고 파악한다. 의문사절은 문장 안에서 명사 역할을 하는 절이다."], ["의문사절 어순", "의문사절은 「의문사+주어+동사」 또는 「의문사+형용사/부사+주어+동사」의 어순으로 쓴다. 이 문장에서는 <b>how upset</b>(얼마나 화가 난)처럼 의문사 뒤에 형용사가 붙는 뒤 형태를 쓴다."], ["배열", "how(의문사) upset(형용사) you(주어) must have been(동사). 'how+형용사'가 한 덩어리로 '얼마나 ~한'을 뜻한다."], ["핵심 문법", "discovered 뒤에는 완전한 문장이 이어진다. 완전한 문장을 목적어로 연결할 때는 접속사 <b>that</b>을 앞에 붙인다."]]}, {"id": 11, "unit": "의문사절", "point": "depend on + 의문사절 (how frequently) · 명사전환 · 수일치", "instr": "윗글의 내용을 한 문장으로 요약하고자 한다. &lt;보기&gt;에 주어진 표현만을 모두 한 번씩 사용하여 문맥과 어법에 맞게 빈칸을 완성하시오. (단, 필요시 형태를 변형할 것.)", "passage": "<span class=\"lead\">Metaphorically</span> speaking, human memory is like a public library that organizes its books according to their predicted popularity. Frequently checked out books, that is, popular books (e.g., the Dan Brown blockbusters), will be made available in special spaces near the entrance of the library to make it easy for members to find them. In contrast, less popular books (e.g., the books by Herta Muller, recipient of the 2009 Nobel Prize in Literature), the ones rarely checked out in the past, will be placed in the back of the library. Because the environment was reflected in our memory, we can use our memory to make inferences about the environment. We can infer, for example, that the more fluently we retrieve an item from memory, the more often we must have encountered it in the past.", "summary": "According to the passage, <span class=\"blank\" style=\"width:30em\">&nbsp;</span>.", "bank": ["frequent", "how", "retrieve", "the", "it", "you", "and", "store", "in human memory", "of information", "depend on", "encounter"], "conds": [], "gist": "인간의 기억은 자주 떠올리는 정보일수록 더 쉽게 접근할 수 있도록 조직되며, 이를 통해 과거 경험의 빈도를 추론할 수 있다.", "answer": "the storage and retrieval of information in human memory depends on how frequently you encountered it.", "answerKo": "인간 기억 속 정보의 저장 및 검색은 얼마나 자주 접했는지에 따라 달라진다.", "accept": ["the storage and retrieval of information in human memory depends on how frequently you encountered it", "the storage and retrieval of information in human memory depends on how frequently you encounter it"], "checkChunks": ["the storage and retrieval of information", "in human memory", "depends on", "how frequently you encountered it"], "hints": {"3": "depend on의 전치사 on 뒤에는 명사가 와야 한다. 보기의 how로 '의문사절'을 만들어 그 자리에 넣자.", "4": "형용사 frequent는 부사 frequently로, 동사 retrieve는 명사 retrieval로, store는 storage로 바꾼다. 주어는 단수 취급하여 depends로 수일치한다.", "5": "<b>the</b> <b>storage</b> <b>and</b> <b>retrieval</b> <b>of information</b> <b>in human memory</b> <b>depends</b> <b>on</b> <b>how</b> <b>frequently</b> <b>you</b> <b>encountered</b> <b>it</b>"}, "sol": [["뼈대 잡기", "「depend on(~에 달려 있다)」의 전치사 on 뒤에는 명사(구·절)가 와야 한다. 보기에 how가 있으므로 <span class=\"pt\">의문사절</span>이 그 명사 자리에 쓰인다고 파악한다."], ["의문사절 어순", "의문사절은 「의문사+형용사/부사+주어+동사」 형태로 쓴다. 이 문장에서는 <b>how frequently</b>(얼마나 자주)로 시작한다."], ["핵심 문법1", "frequent는 형용사다. 뒤의 동사 encountered를 꾸미려면 부사가 필요하므로 <b>frequently</b>로 바꾼다."], ["핵심 문법2", "주어 자리에는 명사가 와야 하므로 동사 retrieve를 명사형 <b>retrieval</b>로, store를 <b>storage</b>로 바꾼다."], ["수일치", "주어의 '저장 및 검색'을 하나의 개념으로 보아 단수 취급하므로 동사 depend에 -s를 붙여 <b>depends</b>로 쓴다."]]}, {"id": 12, "unit": "5형식", "point": "5형식 make+목적어+형용사(목적격보어)", "instr": "다음 글을 읽고 &lt;보기&gt;에 주어진 단어만을 모두 한 번씩만 사용하여 빈칸에 들어갈 말을 문맥과 어법에 맞게 문장을 완성하시오.", "passage": "<span class=\"lead\">Have</span> you ever observed ants marching in and out of their nest? If so, it may have reminded you of a highway packed with cars. But this comparison is not appropriate. Ants never get into a traffic jam in any situations. This is because their movements are based on cooperation. When there are a few ants moving in a single direction, some ants are likely to move slowly, some fast, and others even faster. As their number increases, however, they communicate with each other so that they all move at the same speed. The slow speed up while the fast and the superfast slow down. There are times when ants leaving the nest for food encounter other ants coming back with food on their backs. When this happens, the inbound ants, the ones carrying a burden, always have the right of way. Outbound ants turn to get out of the way, while inbound ants continue in a straight line. This arrangement makes sense because it is more difficult for inbound ants to change direction due to their heavy loads. Following these rules and cooperating in this way, ants improve the traffic flow and <span class=\"blank\" style=\"width:30em\">&nbsp;</span>.", "bank": ["the delivery", "efficient", "to", "food", "of", "make", "more", "the nest", "they"], "conds": [], "gist": "개미는 협력을 통해 교통 체증 없이 효율적으로 움직이며, 방향과 속도를 조정해 식량 운반을 최적화한다.", "answer": "they make the delivery of food to the nest more efficient", "answerKo": "그들은 둥지로 음식을 배달하는 것을 더 효율적으로 만든다.", "accept": ["they make the delivery of food to the nest more efficient"], "checkChunks": ["they make", "the delivery of food to the nest", "more efficient"], "hints": {"3": "동사 make를 5형식(주어+make+목적어+목적격보어)으로 쓴다고 파악하자.", "4": "목적격보어 자리에는 형용사가 온다. 부사 efficiently가 아니라 형용사 efficient를 써서 more efficient로 만든다.", "5": "<b>they</b> <b>make</b> <b>the</b> <b>delivery</b> <b>of</b> <b>food</b> <b>to</b> <b>the nest</b> <b>more</b> <b>efficient</b>"}, "sol": [["뼈대 잡기", "동사 make가 「주어+make+목적어+목적격보어」의 <span class=\"pt\">5형식</span>으로 쓰였다. 5형식은 'A를 ~한 상태로 만들다'라는 뜻이다."], ["핵심 문법", "목적격보어(o.c) 자리에는 명사나 형용사가 온다. 부사는 올 수 없다. 그래서 '효율적인'을 뜻하는 형용사 <b>efficient</b>를 써서 more efficient(더 효율적인)로 만든다."], ["왜 이렇게?", "우리말로는 '효율적으로'처럼 부사같이 해석되어 부사 efficiently를 쓰기 쉽다. 그러나 자리가 목적격보어이므로 반드시 형용사를 써야 한다."], ["배열", "they make the delivery of food to the nest(목적어) more efficient(목적격보어)."]]}, {"id": 13, "unit": "5형식", "point": "5형식 enable+목적어+to부정사 · 병렬 구조", "instr": "다음 글의 요지를 &lt;보기&gt;의 단어를 모두 한 번씩 그대로 사용하여 문맥과 어법에 맞게 완성하시오. (단, Mobility를 주어로 할 것.)", "passage": "<span class=\"lead\">Mobility</span> provides a change to the environment for journalists. Newspaper stories, television reports, and even early online reporting (prior to communication technology such as tablets and smartphones) required one central place to which a reporter would submit his or her news story for printing, broadcast, or posting. Now, though, a reporter can shoot video, record audio, and type directly on their smartphones or tablets and post a news story instantly. Journalists do not need to report to a central location where they all contact sources, type, or edit video. A story can be instantaneously written, shot, and made available to the entire world. The news cycle, and thus the job of the journalist, never takes a break. Thus the “24-hour” news cycle that emerged from the rise of cable TV is now a thing of the past. The news “cycle” is really a constant.", "summary": "Mobility <span class=\"blank\" style=\"width:30em\">&nbsp;</span>.", "bank": ["constantly", "journalists", "report", "news", "and", "to", "the news cycle", "enables", "instantly", "operate", "to"], "conds": ["&lt;보기&gt;의 단어와 어구는 모두 <b>한 번씩만</b> 사용할 것.", "&lt;보기&gt;의 단어와 어구는 <b>변형하지 말 것</b>."], "gist": "기술 발전으로 기자들은 중앙에 모이지 않고도 스마트 기기를 통해 즉시 뉴스를 제작·배포하며, 뉴스는 이제 끊임없이 제공되는 상시적인 흐름이 되었다.", "answer": "enables journalists to report news instantly and the news cycle to operate constantly", "answerKo": "언론인들이 뉴스를 신속하게 보도하고 뉴스 주기가 지속적으로 작동하게 한다.", "accept": ["enables journalists to report news instantly and the news cycle to operate constantly", "enables the news cycle to operate constantly and journalists to report news instantly"], "checkChunks": ["enables journalists", "to report news instantly", "and the news cycle", "to operate constantly"], "hints": {"3": "enable은 「enable+목적어+to부정사」의 5형식으로 쓴다. 주어 Mobility는 이미 나와 있으니 동사부터 배열하자.", "4": "하나의 enables가 두 개의 '목적어+to부정사'를 and로 병렬 연결한다. journalists to report ~ and the news cycle to operate ~.", "5": "<b>enables</b> <b>journalists</b> <b>to</b> <b>report</b> <b>news</b> <b>instantly</b> <b>and</b> <b>the news cycle</b> <b>to</b> <b>operate</b> <b>constantly</b>"}, "sol": [["KEY1", "<span class=\"pt\">5형식 형태</span>: enable은 「enable+목적어+to부정사」 구조로 쓴다. 'A가 ~할 수 있게 하다'라는 뜻이다. 목적격보어 자리에 to부정사를 두는 동사로는 <b>want, tell, ask, enable, encourage, urge, expect, cause, persuade</b> 등이 있다."], ["KEY2", "병렬 구조: 하나의 동사 enables가 두 개의 「목적어+to부정사」를 이끈다. <b>and</b>를 사이에 두고 같은 형태끼리 나란히 연결한다."], ["배열", "Mobility enables journalists(목적어1) to report news instantly(to부정사1) and the news cycle(목적어2) to operate constantly(to부정사2). 앞뒤 모두 '목적어+to부정사' 형태로 짝을 맞춘다."]]}, {"id": 14, "unit": "5형식", "point": "사역동사 have+목적어+동사원형 · 동명사 주격보어", "instr": "다음 글을 읽고 &lt;보기&gt;에 주어진 단어를 모두 한 번씩만 사용하여 빈칸을 완성하시오. (필요시 문맥과 어법에 맞게 형태를 변형할 것)", "passage": "<span class=\"lead\">When</span> a child experiences painful, disappointing, or scary moments, it can be overwhelming, with intense emotions and bodily sensations flooding the right brain. When this happens, we as parents can help bring the left hemisphere into the picture so that the child can begin to understand what’s happening. One of the best ways to promote this type of integration <span class=\"blank\" style=\"width:30em\">&nbsp;</span>. Bella, for instance, was nine years old when the toilet overflowed when she flushed, and the experience of watching the water rise and pour onto the floor left her unwilling to flush the toilet afterward. When Bella’s father, Doug, learned about the “name it to tame it” technique, he sat down with his daughter and retold the story of the time the toilet overflowed. He allowed her to tell as much of the story as she could and helped to fill in the details. After retelling the story several times, Bella’s fears lessened and eventually went away.", "bank": ["story", "possible", "a child", "as much", "have", "the", "painful", "as", "retell", "be"], "conds": [], "gist": "부모는 아이가 두려운 경험을 극복하도록 돕기 위해 이야기로 감정을 표현하고 이해하도록 도울 수 있다.", "answer": "is having a child retell the painful story as much as possible", "answerKo": "아이가 고통스러운 이야기를 가능한 한 많이 다시 들려주게 하는 것이다.", "accept": ["is having a child retell the painful story as much as possible"], "checkChunks": ["is having", "a child retell", "the painful story", "as much as possible"], "hints": {"3": "주어(One of the best ways ~) 뒤 be동사 is의 주격보어 자리를 채운다.", "4": "남는 동사 have를 동명사 having으로 바꿔 주격보어로 둔다. 사역동사 have는 「have+목적어+동사원형」이므로 a child 뒤에 동사원형 retell을 쓴다.", "5": "<b>is</b> <b>having</b> <b>a child</b> <b>retell</b> <b>the</b> <b>painful</b> <b>story</b> <b>as much</b> <b>as</b> <b>possible</b>"}, "sol": [["뼈대 잡기", "주어(One of the best ways ~) 다음에 be동사 is가 있다. be동사 뒤는 <span class=\"pt\">주격보어</span> 자리다."], ["핵심 문법", "한 문장에는 동사가 하나만 쓰인다. 보기에는 be 말고도 동사가 더 있으므로 남는 동사는 동명사(-ing)로 바꾼다. have를 동명사 <b>having</b>으로 바꾸어 주격보어 자리에 둔다."], ["사역동사", "having은 사역동사 have다. 사역동사 have는 「have+목적어+동사원형」 구조로 '~에게 …하게 하다'를 뜻한다."], ["배열", "is having(주격보어·동명사) a child(목적어) <b>retell</b>(동사원형) the painful story as much as possible. a child 뒤에 동사원형 retell이 온 점에 주목한다."]]}, {"id": 15, "unit": "5형식", "point": "allow+목적어+to부정사 · think of A as B · 수일치", "instr": "다음 글을 읽고 빈칸에 들어갈 말을 주어진 &lt;조건&gt;에 맞게 작성하시오.", "passage": "<span class=\"lead\">Many</span> people believe that their intellectual ability is hardwired from birth, and that failure to meet a learning challenge shows how bad their native ability is. But every time you learn something new, you change the brain — the residue of your experiences is stored. It’s true that we start life with the gift of our genes, but it’s also true that we become capable through the learning and development of mental models that enable us to reason, solve, and create. In other words, the elements that shape your intellectual abilities lie to a surprising extent within your own control. Understanding <span class=\"blank\" style=\"width:30em\">&nbsp;</span> and a source of useful information — the need to dig deeper or to try a different strategy.", "bank": ["as a", "allow", "is", "so", "you", "to", "effort", "failure", "badge", "of", "think of", "that", "this"], "conds": ["아래 주어진 표현을 모두 한 번씩만 사용하되, 필요시 문맥과 어법에 맞게 형태를 바꿀 것."], "gist": "지적 능력은 학습과 경험으로 변화하며, 실패는 노력의 증거이자 성장의 기회로 받아들여야 한다.", "answer": "that this is so allows you to think of failure as a badge of effort", "answerKo": "이것이 그렇다는 것을 이해하는 것은 실패를 노력의 상징으로 생각할 수 있게 한다.", "accept": ["that this is so allows you to think of failure as a badge of effort"], "checkChunks": ["that this is so", "allows you", "to think of failure", "as a badge of effort"], "hints": {"3": "동명사 Understanding이 주어다. 그 목적어와 이어질 동사를 잡아 보자.", "4": "understanding의 목적어는 완전한 문장 앞에 that을 붙인 that this is so. allow는 「allow+목적어+to부정사」로 쓰고 동명사 주어에 맞춰 allows로 수일치한다.", "5": "<b>that</b> <b>this</b> <b>is</b> <b>so</b> <b>allows</b> <b>you</b> <b>to</b> <b>think of</b> <b>failure</b> <b>as a</b> <b>badge</b> <b>of</b> <b>effort</b>"}, "sol": [["뼈대 잡기", "Understanding(동명사)이 주어다. 그 뒤에 목적어로 무엇이 오는지 잡는 것이 관건이다."], ["목적어 잡기", "understanding의 목적어는 <b>that this is so</b>다. this is so(이것이 그러하다)가 '주어+동사'를 갖춘 완전한 문장이므로, 앞에 접속사 that을 붙여 목적어절을 만든다."], ["KEY1", "<span class=\"pt\">allow+목적어+to부정사</span>: allow는 「allow+목적어+to부정사」 구조로 쓴다. 'A가 ~하게 하다'라는 뜻이다."], ["KEY2", "<span class=\"pt\">think of A as B</span>: 'A를 B로 생각하다'. 여기서는 <b>think of failure as a badge of effort</b>로 쓴다."], ["수일치", "주어가 동명사 Understanding이다. 동명사 주어는 단수 취급하므로 동사 allow에 -s를 붙여 <b>allows</b>로 수일치한다."]]}, {"id": 16, "unit": "5형식", "point": "관계대명사 계속적 용법 · 사역동사 make", "instr": "다음 글의 요지를 한 문장으로 표현하고자 한다. 빈칸에 들어갈 말을 주어진 &lt;조건&gt;에 맞게 작성하시오.", "passage": "<span class=\"lead\">It</span> was usual among \"savages\" for the man who had food to share it with the man who had none, for travelers to be fed at any home they chose to stop at on their way, and for communities harassed with drought to be maintained by their neighbors. If a man sat down to his meal in the woods, he was expected to call loudly for someone to come and share it with him, before he might justly eat alone. When a Western traveler told the Samoan people about the poor in London, the \"savages\" asked in astonishment: \"How is it? No food? No friends? No house to live in? Where did he grow? Are there no houses belonging to his friends?\" The hungry Indian had but to ask to receive; however small the supply was, food was given to him if he needed it: \"no one can want food while there is corn anywhere in the town.\"", "summary": "Savages had a cultural practice of assisting and sharing food with others in need without conditions, <span class=\"blank\" style=\"width:30em\">&nbsp;</span> in London.", "bank": ["understand", "there", "a hard time", "which", "be", "had", "people", "why", "them", "make", "poor"], "conds": ["아래 주어진 표현을 모두 한 번씩만 사용하되, 필요시 문맥과 어법에 맞게 형태를 바꿀 것."], "gist": "원시 사회에서 음식과 자원을 서로 나누는 관습이 보편적이었다.", "answer": "which made them have a hard time understanding why there were poor people", "answerKo": "그로 인해 그들은 왜 가난한 사람들이 있는지 이해하는 데 어려움을 겪었다.", "accept": ["which made them have a hard time understanding why there were poor people"], "checkChunks": ["which made them", "have a hard time", "understanding", "why there were poor people"], "hints": {"3": "앞 문장이 완전하고 접속사가 없다. 관계대명사의 계속적 용법(, which)으로 연결하자.", "4": "which는 앞 내용을 받는 주격 관계대명사다. 사역동사 make를 made them have로 쓰고, have a hard time -ing(~하는 데 어려움을 겪다)로 배열한다.", "5": "<b>which</b> <b>made</b> <b>them</b> <b>have</b> <b>a hard time</b> <b>understanding</b> <b>why</b> <b>there</b> <b>be(were)</b> <b>poor</b> <b>people</b>"}, "sol": [["뼈대 잡기", "앞 문장이 이미 완전하고, 두 문장을 잇는 접속사가 따로 없다. 이럴 때는 '접속사+주어' 역할을 한꺼번에 하는 <span class=\"pt\">관계대명사의 계속적 용법</span>을 쓴다."], ["핵심 문법", "계속적 용법이란 「, + 주격 관계대명사(who, which)」 형태로, 앞 내용에 대한 정보를 덧붙일 때 쓴다. 사람이 아닌 앞 내용을 받으므로 <b>which</b>를 쓴다."], ["사역동사", "made는 사역동사 make다. 「make+목적어+동사원형」 구조로 '~에게 …하게 하다'를 뜻한다. 여기서는 <b>made them have</b>가 된다."], ["숙어", "have a hard time -ing: '~하는 데 어려움을 겪다'. 그래서 <b>have a hard time understanding</b>으로 배열한다."]]}, {"id": 17, "unit": "5형식", "point": "사역동사 let+목적어+동사원형 · 관계대명사 what", "instr": "다음 &lt;보기&gt;에 주어진 단어만을 그대로 사용하여 필자가 주장하는 바를 완성하시오.", "passage": "<span class=\"lead\">Too</span> often we notice that a sister, brother, parent, or child is particularly good at showing empathy, is exceedingly honest, is extremely fair, or shows a great deal of integrity, but we don’t mention what we are observing out loud. You may have noticed that your children seem far more comfortable with being sarcastic or insulting one another. Giving compliments often feels more awkward than offering “constructive criticism.” However, when we share the good that we see, we let our children or our partner know that we have recognized their strengths. Also, by acknowledging that each person brings different strengths to the family unit, we can learn from one another and work as a team.", "summary": "When you <span class=\"blank\" style=\"width:22em\">(A)</span>, <span class=\"blank\" style=\"width:16em\">(B)</span>.", "bank": ["of your family members", "recognize", "you", "let", "know", "the strengths", "them", "what", "observe"], "conds": [], "gist": "가족 구성원의 장점을 칭찬하고 인정하면 서로의 강점을 배울 수 있고 가족의 팀워크를 강화할 수 있다.", "answer": "(A) recognize the strengths of your family members\n(B) let them know what you observe", "answerKo": "가족 구성원의 강점을 인식할 때, 관찰한 내용을 그들에게 알려주어라.", "requireAll": ["recognize the strengths of your family members", "let them know what you observe"], "checkChunks": ["recognize the strengths", "of your family members", "let them know", "what you observe"], "hints": {"3": "보기의 let을 보고 사역동사 구문을 떠올리자.", "4": "(A) recognize the strengths of your family members. (B) 사역동사 let은 「let+목적어+동사원형」이므로 let them know로 쓰고, know의 목적어로 관계대명사 what이 이끄는 what you observe를 붙인다.", "5": "(A) <b>recognize</b> <b>the strengths</b> <b>of your family members</b> / (B) <b>let</b> <b>them</b> <b>know</b> <b>what</b> <b>you</b> <b>observe</b>"}, "sol": [["(A) 뼈대", "When you 뒤 (A)에는 동사원형으로 시작하는 절이 온다. <b>recognize the strengths of your family members</b>."], ["(B) 사역동사", "보기에 let이 보이면 <span class=\"pt\">사역동사 구문</span>을 떠올린다. 사역동사 let은 [let+목적어+동사원형] 구조로 쓰인다. 이 문장에서는 <b>let them know</b> 순서로 배열한다."], ["what절", "know의 목적어로 관계대명사 what이 이끄는 절이 쓰였다. what은 그 자체에 선행사(the thing)를 품고 있어 [what+불완전한 문장]의 형태로 쓴다. 그래서 <b>what you observe</b>에서 observe의 목적어가 비어 있는 불완전한 문장이 된다."]]}, {"id": 18, "unit": "특수구문", "point": "not only A but also B (병렬)", "instr": "다음 글을 읽고, 주어진 &lt;보기&gt;의 단어를 한 번씩만 모두 사용하여 요약문을 완성하시오.", "passage": "<span class=\"lead\">We</span> all surround ourselves with a “personal bubble” that we go to great lengths to protect. We open the bubble to our friends, children, parents, and so on, but we’re careful to keep most people out of this space. When we stand in line, we make certain there is enough space so that we don’t touch the person in front of us and aren’t touched by the person behind us. At times, we extend our personal space. In the library, for example, you may place your coat on the chair next to you—claiming that space for yourself even though you aren’t using it. If you want to really widen your space, you might even spread books in front of the other chairs, keeping the whole table to yourself by giving the impression that others have just stepped away.", "summary": "According to the passage, <span class=\"blank\" style=\"width:30em\">&nbsp;</span>.", "bank": ["private", "but also", "we", "it", "tend to", "expand", "not only", "our", "space", "protect"], "conds": [], "gist": "사람들은 자신의 개인적 공간을 보호하려 노력하며, 상황에 따라 이를 확장하기도 한다.", "answer": "We tend to not only protect our private space but also expand it.", "answerKo": "우리는 사적인 공간을 보호할 뿐만 아니라 확장하는 경향이 있다.", "accept": ["We tend to not only protect our private space but also expand it", "We tend to not only expand our private space but also protect it"], "checkChunks": ["we tend to", "not only protect", "our private space", "but also expand it"], "hints": {"3": "보기의 not only / but also에 주목해 두 동작을 나열하는 구문임을 파악해요.", "4": "우리가 사적 공간을 '보호(protect)'하고 '확장(expand)'한다는 두 동사원형을 병렬로 연결해요. 공통의 to는 not only 앞에 한 번만 씁니다.", "5": "<b>We</b> <b>tend to</b> <b>not only</b> <b>protect</b> <b>our</b> <b>private</b> <b>space</b> <b>but also</b> <b>expand</b> <b>it</b>."}, "sol": [["핵심 문법", "보기에 <b>not only</b>, <b>but also</b>가 보이면 <span class=\"pt\">not only A but (also) B</span> (A뿐만 아니라 B도) 구문을 떠올린다."], ["병렬 맞추기", "A와 B는 형태가 같아야 한다. A가 동사원형이면 B도 동사원형으로 맞춘다."], ["배열", "공통의 to를 <b>not only</b> 앞으로 한 번만 빼고, A·B 자리에는 동사원형을 넣어 <span class=\"pt\">to not only protect ... but also expand ...</span> 형태로 쓴다."]]}, {"id": 19, "unit": "특수구문", "point": "not A but B (병렬)", "instr": "다음 글을 읽고, &lt;보기&gt;에 주어진 표현만을 모두 한 번씩 그대로 사용하여 빈칸을 문맥과 어법에 맞게 완성하시오.", "passage": "<span class=\"lead\">You</span> can buy conditions for happiness, but you can’t buy happiness. It’s like playing tennis. You can’t buy the joy of playing tennis at a store. You can buy the ball and the racket, but you can’t buy the joy of playing. To experience the joy of tennis, you have to learn, to train yourself to play. It’s the same with writing calligraphy. You can buy the ink, the rice paper, and the brush, but if you don’t cultivate the art of calligraphy, you can’t really do calligraphy. So calligraphy requires practice, and you have to train yourself. You are happy as a calligrapher only when you have the capacity to do calligraphy. Happiness is also like that. <span class=\"blank\" style=\"width:29em\">&nbsp;</span>.", "bank": ["not", "but from", "purchase", "happiness", "does", "from", "cultivation", "come"], "conds": [], "gist": "행복은 물건이 아닌 능력과 노력을 통해 얻어지는 경험이다.", "answer": "Happiness does not come from purchase but from cultivation.", "answerKo": "행복은 구매에서 오는 것이 아니라 발전에서 비롯된다.", "accept": ["Happiness does not come from purchase but from cultivation"], "checkChunks": ["does not come", "from purchase", "but from cultivation"], "hints": {"3": "보기의 not과 but from을 보고 'A가 아니라 B' 구문임을 알아채요.", "4": "행복은 '구매(purchase)'가 아니라 '발전/노력(cultivation)'에서 온다는 뜻으로 배열해요.", "5": "but from에 맞춰 A 자리에도 <b>from</b>을 써서 from purchase / from cultivation으로 대칭을 맞춰요."}, "sol": [["not A but B", "보기에 <b>but from</b>이 보이므로 <span class=\"pt\">not A but B</span> (A가 아니라 B) 구문을 떠올린다."], ["병렬 맞추기", "A와 B는 형태가 같아야 한다. <b>but from</b>이 주어졌으므로 A 자리에도 <b>from</b>이 온다."], ["배열", "<span class=\"pt\">Happiness does not come from purchase but from cultivation</span> 순으로 배열한다."]]}, {"id": 20, "unit": "제목(구)", "point": "명사구 제목 · of + 동명사", "instr": "다음 글의 주제를 본문에 있는 단어만을 사용하여 10단어 이하로 쓰시오. (단, 필요시 문맥과 어법에 맞게 어형을 변형할 것)", "passage": "<span class=\"lead\">When</span> I was young, my parents worshipped medical doctors as if they were exceptional beings possessing godlike qualities. But I had never been motivated to pursue a career in medicine until I entered the hospital for a rare disease. I became a medical curiosity, attracting some of the area’s top specialists to look in on me and review my case. As a patient, and a teenager eager to return to college, I asked each doctor who examined me, “What caused my disease?” “How will you make me better?” The typical response was nonverbal. They shook their heads and walked out of my room. I remember thinking to myself, “Well, I could do that.” When it became clear to me that no doctor could answer my basic questions, I walked out of the hospital against medical advice. Returning to college, I pursued medicine with a great passion.", "bank": [], "conds": ["본문에 있는 단어만을 사용하여 <b>10단어 이하</b>로 쓸 것", "필요시 어형을 변형할 것"], "gist": "질병을 통해 의학에 실망했지만 스스로 의사가 되어 문제를 해결하겠다는 결심을 하게 된 경험담.", "answer": "Motivation of pursuing a career in medicine", "answerKo": "의학에서 경력을 추구하는 동기.", "accept": ["Motivation of pursuing a career in medicine", "Motivation for pursuing a career in medicine", "The motivation of pursuing a career in medicine", "motivation to pursue a career in medicine", "The motivation to pursue a career in medicine", "The motivation for pursuing a career in medicine"], "checkChunks": ["Motivation", "pursuing", "career", "medicine"], "hints": {"3": "글 전체가 '의학의 길을 걷게 된 동기'에 관한 내용임을 파악해요.", "4": "핵심어 motivation과 pursue, career, medicine을 명사구로 엮어요.", "5": "of 뒤의 동사는 동명사로 바꿔 <b>of pursuing</b> 형태로 써요."}, "sol": [["뼈대 잡기", "제목 문제이므로 <b>주어+동사</b> 문장이 아니라 <span class=\"pt\">명사구</span> 형태로 답한다."], ["단어 변형", "전치사 <b>of</b> 뒤에는 명사(구)가 와야 하므로 동사 pursue를 동명사 <span class=\"pt\">pursuing</span>으로 바꾼다."]]}, {"id": 21, "unit": "제목(구)", "point": "의문사 + to부정사 제목구", "instr": "다음 글의 주제를 본문에 있는 단어만을 사용하여 5단어 이내로 완성하시오. (단, 필요시 문맥과 어법에 맞게 어형을 변형할 것)", "passage": "<span class=\"lead\">Do</span> you know one of the best remedies for coping with family tension? Two words: “I’m sorry.” It’s amazing how hard some people find them to say. They think it implies weakness or defeat. Nothing of the kind. In fact, it is exactly the opposite. Another good way of relieving tension is a row! The sea is ever so much calmer after a storm. A row has another advantage. When tempers are raised, unspoken truths usually come out. They may hurt a bit, especially at the time. Yet, at the end, you know each other a bit better. Lastly, most of the tensions and quarrels between children are natural. Even when they seem to be constant, wise parents don’t worry too much.", "summary": "How <span class=\"blank\" style=\"width:13em\">&nbsp;</span>", "bank": [], "conds": ["본문에 있는 단어만을 사용하여 <b>5단어 이내</b>로 완성할 것", "필요시 어형을 변형할 것"], "gist": "가족 간의 긴장을 풀기 위해서는 진심 어린 사과와 솔직한 대화를 통해 서로를 더 잘 이해하는 것이 중요하다.", "answer": "How to relieve family tension", "answerKo": "가족의 긴장을 해소하는 방법.", "accept": ["How to relieve family tension", "to relieve family tension", "How to relieve family tensions", "relieve family tension"], "checkChunks": ["relieve", "family tension"], "hints": {"3": "글은 '가족 간 긴장을 푸는 방법'을 다루고 있어요.", "4": "주어진 How에 이어 '긴장을 해소하다(relieve tension)'를 연결해요.", "5": "[의문사+to부정사] 형태를 이용해 <b>How to relieve family tension</b>으로 완성해요."}, "sol": [["뼈대 잡기", "제목 문제이므로 문장이 아니라 <span class=\"pt\">구</span> 형태로 답한다."], ["핵심 문법", "의문사를 쓸 때는 [의문사+주어+동사]뿐만 아니라 <span class=\"pt\">[의문사+to부정사]</span> 형태로도 쓸 수 있다."], ["배열", "<span class=\"pt\">How to relieve family tension</span>으로 배열하면 '~하는 방법'의 뜻이 된다."]]}, {"id": 22, "unit": "제목·요지", "point": "from A to B · 동명사", "instr": "다음 글을 읽고 요지를 쓰고자 한다. &lt;보기&gt;에 주어진 표현만을 모두 한 번씩 사용하여 문맥과 어법에 맞게 빈칸을 완성하시오. (단, 필요시 어법에 맞게 단어의 형태를 변형할 것.)", "passage": "<span class=\"lead\">Until</span> recently psychology has mainly been working within a disease model: a strong emphasis has been placed on discovering deficits in human behaviour and finding ways to repair this damage. Psychologists hardly focused on doing studies acquiring knowledge about healthy functioning and building strengths. In other words, they have focused solely on taking away something negative (the dysfunctioning) instead of adding something positive (increasing mental and behavioural health). The result is that psychologists know little about healthy and happy functioning. This situation has been changing now since the rise of positive psychology a few years ago. What is Positive Psychology? It is a new movement in psychology, originated by Martin Seligman and a few other prominent psychologists. It aims to be a psychological science about the best things in life.", "summary": "According to the passage, <span class=\"blank\" style=\"width:30em\">&nbsp;</span>.", "bank": ["focus", "of", "ones", "to", "psychology", "on", "have", "negative", "from", "change", "life", "be", "things", "positive", "emphasize"], "conds": [], "gist": "심리학은 주로 결함 수정에 집중했으나, 긍정 심리학의 등장으로 건강하고 행복한 삶을 탐구하는 데 초점이 옮겨졌다.", "answer": "Psychology has been changing from focusing on negative things of life to emphasizing positive ones.", "answerKo": "심리학은 삶의 부정적인 것에 집중하는 것에서 긍정적인 것을 강조하는 것으로 변화하고 있다.", "accept": ["Psychology has been changing from focusing on negative things of life to emphasizing positive ones"], "checkChunks": ["has been changing", "from focusing on negative", "to emphasizing positive ones"], "hints": {"3": "보기의 from과 to를 보고 'A에서 B로 변화한다'는 구조를 떠올려요.", "4": "심리학이 '부정적인 것에 집중'에서 '긍정적인 것을 강조'로 바뀌었다고 배열해요.", "5": "전치사 뒤 동사는 동명사로 바꿔 <b>focusing</b>, <b>emphasizing</b>으로 써요."}, "sol": [["핵심 문법", "보기에 <b>from</b>과 <b>to</b>가 함께 보이면 <span class=\"pt\">from A to B</span> (A에서 B로) 구조를 떠올린다."], ["단어 변형", "from·to는 전치사이므로 뒤의 동사를 동명사로 바꿔 <span class=\"pt\">from focusing ... to emphasizing ...</span>로 쓴다."]]}, {"id": 23, "unit": "제목·요지", "point": "equip A with B · 과거분사 수식", "instr": "다음 글의 내용을 요약하고자 한다. &lt;보기&gt;에 주어진 표현만을 모두 한 번씩 사용하여 빈칸을 문맥과 어법에 맞게 완성하시오. (단, 필요시 어법에 맞게 단어의 형태를 변형할 것.)", "passage": "<span class=\"lead\">In</span> an experiment in Germany, part of a fleet of taxicabs in Munich was equipped with antilock brake systems (ABS), a technological innovation that vastly improves braking. The rest of the fleet was left unequipped, and the two groups were placed under careful and secret observation for three years. You would expect the better brakes to make for safer driving. However, that is exactly the opposite of what happened. Giving some drivers ABS made no difference at all in their accident rate; in fact, it turned them into markedly inferior drivers. They drove faster. They made sharper turns. They braked harder. In other words, the ABS systems were not used to reduce accidents; instead, the drivers used the additional element of safety to enable them to drive faster and more recklessly without increasing their risk of getting into an accident.", "summary": "According to the passage, <span class=\"blank\" style=\"width:30em\">&nbsp;</span>.", "bank": ["serve", "not", "safe", "equip", "did", "upgrade", "the taxis", "braking", "driving", "with"], "conds": [], "gist": "ABS가 사고를 줄이기보다 운전자들에게 과속과 난폭 운전을 유도해 안전성을 저하시켰다.", "answer": "equipping the taxis with upgraded braking did not serve safe driving.", "answerKo": "택시에 업그레이드된 제동 장치를 장착하는 것은 안전한 운전에 도움이 되지 않는다.", "accept": ["equipping the taxis with upgraded braking did not serve safe driving"], "checkChunks": ["equipping the taxis with upgraded braking", "did not serve", "safe driving"], "hints": {"3": "글은 '더 좋은 브레이크가 안전 운전으로 이어지지 않았다'는 내용이에요.", "4": "equip A with B 구문으로 '택시에 업그레이드된 제동장치를 갖추다'를 표현해요. 주어 자리이므로 equip을 동명사 equipping으로 바꿉니다.", "5": "<b>equipping</b> <b>the taxis</b> <b>with</b> <b>upgraded</b> <b>braking</b> <b>did</b> <b>not</b> <b>serve</b> <b>safe</b> <b>driving</b>."}, "sol": [["핵심 문법", "<span class=\"pt\">equip A with B</span> (A에 B를 갖추다) 구문이 쓰였고, serve는 '도움이 되다'의 뜻이다."], ["단어 변형", "제동 장치는 '업그레이드되는' 대상이므로 과거분사 <span class=\"pt\">upgraded</span>로 바꿔 upgraded braking으로 쓴다. 문장의 주어 자리이므로 equip은 동명사 equipping으로 바꾼다."]]}, {"id": 24, "unit": "제목·요지", "point": "형용사 변형 · 동명사 · 수일치", "instr": "다음 글의 내용을 요약하고자 한다. &lt;보기&gt;에 주어진 표현만을 모두 한 번씩 사용하여 문맥과 어법에 맞게 빈칸을 완성하시오. (단, 필요시 어법에 맞게 단어의 형태를 변형할 것.)", "passage": "<span class=\"lead\">Benjamin</span> Franklin began and ended each day with a question: “What good shall I do this day?” in the morning, and “What good have I done this day?” in the evening. In fact, many great thinkers embraced the idea of constantly questioning things. As Albert Einstein reportedly said, “Learn from yesterday, live for today, hope for tomorrow. The important thing is not to stop questioning.” Of course, getting into the habit of self-reflection is easier said than done, as we often prefer to avoid asking ourselves the tough questions. As philosopher and psychologist John Dewey explained in his 1910 book, How We Think, reflective thinking involves overcoming our predisposition to accept things at face value and the willingness to endure mental unrest. Enduring this discomfort is well worth the effort, as it can result in the confidence boost necessary to perform better in our work and daily lives.", "summary": "According to the passage, <span class=\"blank\" style=\"width:30em\">&nbsp;</span>.", "bank": ["through", "better", "to", "thinking", "in life", "question", "reflect", "performance", "lead"], "conds": [], "gist": "자기 성찰과 질문하는 습관은 불편하지만, 이를 통해 삶과 일에서 자신감을 키우고 더 나은 성과를 얻을 수 있다.", "answer": "reflective thinking through questioning leads to better performance in life.", "answerKo": "질문을 통한 반성적 사고는 삶의 더 나은 성과로 이어진다.", "accept": ["reflective thinking through questioning leads to better performance in life"], "checkChunks": ["reflective thinking", "through questioning", "leads to better performance", "in life"], "hints": {"3": "글은 '질문을 통한 성찰적 사고가 더 나은 성과로 이어진다'는 내용이에요.", "4": "reflect를 형용사 reflective로, question을 동명사 questioning으로 바꿔 주어를 만들어요.", "5": "단수 주어에 맞춰 동사를 <b>leads</b>로 수일치시켜요."}, "sol": [["뼈대 잡기", "<span class=\"pt\">reflective thinking through questioning</span>이 주어, <b>leads</b>가 동사인 문장이다."], ["단어 변형", "동사 reflect를 명사 thinking을 꾸미는 형용사 <span class=\"pt\">reflective</span>로 바꾼다. 전치사 through 뒤에는 명사(구)가 와야 하므로 question을 동명사 <span class=\"pt\">questioning</span>으로 바꾼다."], ["수일치", "주어의 핵심이 단수 thinking이므로 동사에 -s를 붙여 <span class=\"pt\">leads</span>로 쓴다."]]}, {"id": 25, "unit": "제목·요지", "point": "주격 관계대명사 that · cause + to부정사", "instr": "다음 글의 내용을 요약하고자 한다. &lt;보기&gt;에 주어진 표현만을 모두 한 번씩 그대로 사용하여 문맥과 어법에 맞게 빈칸을 완성하시오.", "passage": "<span class=\"lead\">Children</span> today are “safe.” Their only worries consist of fights with their parents, going to school, and dealing with the list of activities that they’re signed up for. But what’s going on? If they’re “safe” and living “well,” why do they experience so many problems? Children have learned to be cautious; a lot of kids have even lost that innate curiosity that no one should ever lose. The big problem is that they are exposed to large flows of information that are hardly processable. It’s even hard for us. That’s why being exposed to so much stimuli causes stress that they’re incapable of tolerating. All this causes children to grow up quickly, going through their developmental stages without enjoying them. They don’t live their childhood the way they should, which could cause them serious problems that are difficult to solve later on.", "summary": "According to the passage, <span class=\"blank\" style=\"width:30em\">&nbsp;</span>.", "bank": ["to process", "excessive", "lose", "information", "childhood", "that", "hard", "causes", "children", "is", "to", "their"], "conds": [], "gist": "현대 아이들은 과도한 정보와 자극으로 스트레스를 받으며, 충분히 어린 시절을 즐기지 못해 성장 과정에서 문제를 겪을 수 있다.", "answer": "excessive information that is hard to process causes children to lose their childhood.", "answerKo": "처리하기 어려운 과도한 정보로 인해 아이들은 어린 시절을 잃게 된다.", "accept": ["excessive information that is hard to process causes children to lose their childhood"], "checkChunks": ["excessive information", "that is hard to process", "causes children", "to lose their childhood"], "hints": {"3": "글은 '처리하기 힘든 과도한 정보가 아이들의 어린 시절을 앗아간다'는 내용이에요.", "4": "주격 관계대명사 that으로 excessive information을 수식하게 배열해요.", "5": "cause 뒤 목적격 보어는 to부정사이므로 <b>to lose</b>로 써요."}, "sol": [["뼈대 잡기", "문장의 is와 causes가 모두 단수 동사이므로 주어가 단수 <span class=\"pt\">excessive information</span>임을 파악한다."], ["핵심 문법", "주격 관계대명사 <b>that</b>이 이끄는 절 <span class=\"pt\">(that is hard to process)</span>이 앞 명사를 수식한다."], ["단어 변형", "cause는 목적격 보어로 to부정사를 취하므로 <span class=\"pt\">to lose</span> 형태로 쓴다."]]}];

/* ---------- grading ---------- */
function norm(s){return (s||"").toLowerCase().replace(/[‘’′'`´]/g,'').replace(/[“”″"]/g,' ').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();}
function isCorrect(p, raw){const n=norm(raw);if(!n)return false;if(p.accept&&p.accept.some(a=>norm(a)===n))return true;if(p.requireAll&&p.requireAll.every(ph=>n.includes(norm(ph))))return true;return false;}
function findMisses(p, raw){const n=norm(raw);const out=[];(p.checkChunks||[]).forEach(c=>{if(!n.includes(norm(c)))out.push(c);});return out;}
function esc(s){return (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sticker(k){return STICKERS[k]||'';}

/* ---------- morphology engine (for transform menu) ---------- */
const IRREG={
 be:['be','am','is','are','was','were','been','being'],
 have:['have','has','had','having'],
 do:['do','does','did','done','doing'],
 make:['make','makes','made','making'],
 put:['put','puts','putting'],
 spend:['spend','spends','spent','spending'],
 give:['give','gives','gave','given','giving'],
 get:['get','gets','got','gotten','getting'],
 go:['go','goes','went','gone','going'],
 take:['take','takes','took','taken','taking'],
 come:['come','comes','came','coming'],
 find:['find','finds','found','finding'],
 draw:['draw','draws','drew','drawn','drawing'],
 keep:['keep','keeps','kept','keeping'],
 feel:['feel','feels','felt','feeling'],
 lead:['lead','leads','led','leading'],
 hold:['hold','holds','held','holding'],
 run:['run','runs','ran','running'],
 write:['write','writes','wrote','written','writing'],
 good:['good','better','best'],bad:['bad','worse','worst'],
 little:['little','less','least'],much:['much','more','most'],many:['many','more','most'],far:['far','farther','further','farthest']
};
/* bank words that need a derivational/irregular form the rule engine can't build — inject exact forms */
const FORM_EXTRA={
  'create':['create','creates','created','creating','creative','to create'],
  'draw out':['draw out','draws out','drew out','drawing out'],
  'difficultly':['difficultly','difficult'],
  'interact':['interact','interacts','interacted','interacting','interaction','to interact'],
  'consideration':['consideration','consider','considers','considered','considering'],
  'proper':['proper','properly'],
  'religion':['religion','religious'],
  'infect':['infect','infects','infected','infecting','infectious'],
  'perceive':['perceive','perceives','perceived','perceiving','perception'],
  'store':['store','stores','stored','storing','storage'],
  'retrieve':['retrieve','retrieves','retrieved','retrieving','retrieval'],
  'depend on':['depend on','depends on','depended on','depending on'],
  'frequent':['frequent','frequently'],
  'had':['had','have','has','having'],
  'equip':['equip','equips','equipped','equipping','to equip'],
  'reflect':['reflect','reflects','reflected','reflecting','reflective','reflection'],
  'you':['you','your','yours']
};
function lemmas(w){const cand=new Set([w]);const add=x=>{if(x&&x.length>1)cand.add(x);};
  if(w.endsWith('ing')){add(w.slice(0,-3));add(w.slice(0,-3)+'e');}
  if(w.endsWith('ied')){add(w.slice(0,-3)+'y');}else if(w.endsWith('ed')){add(w.slice(0,-2));add(w.slice(0,-1));}
  if(w.endsWith('ies')){add(w.slice(0,-3)+'y');}else if(w.endsWith('es')){add(w.slice(0,-2));add(w.slice(0,-1));}else if(w.endsWith('s')&&!w.endsWith('ss')){add(w.slice(0,-1));}
  // NOTE: no -er/-est stripping — bank words are base forms; stripping made bogus stems (volunteer->volunte)
  const valid=[...cand].filter(b=> b===w || (IRREG[b]&&IRREG[b].includes(w)) || regForms(b).includes(w));
  return valid.length?valid:[w];
}
function regForms(b){const f=[];f.push(b);
  if(/(s|x|z|ch|sh)$/.test(b))f.push(b+'es');else if(/[^aeiou]y$/.test(b))f.push(b.slice(0,-1)+'ies');else f.push(b+'s');
  if(/e$/.test(b)&&!/ee$/.test(b))f.push(b.slice(0,-1)+'ing');else f.push(b+'ing');
  if(/e$/.test(b))f.push(b+'d');else if(/[^aeiou]y$/.test(b))f.push(b.slice(0,-1)+'ied');else f.push(b+'ed');
  f.push('to '+b);
  if(/[^aeiou]y$/.test(b))f.push(b.slice(0,-1)+'ier');else if(/e$/.test(b))f.push(b+'r');else f.push(b+'er');
  return f;
}
function variantForms(word){
  const w=word.toLowerCase().trim();
  const extra=FORM_EXTRA[w]||[];
  if(w.includes(' ')) { const m=[word]; extra.forEach(x=>{if(!m.includes(x))m.push(x);}); return m; }
  // primary: forms from the word itself (the common, relevant inflections)
  const primary=[];
  if(IRREG[w]){ IRREG[w].forEach(x=>primary.push(x)); primary.push('to '+w); }
  else regForms(w).forEach(x=>primary.push(x));
  // secondary: forms from stripped lemmas (for already-inflected bank words, e.g. working->works)
  const secondary=[];
  lemmas(w).forEach(b=>{ if(b===w) return; if(IRREG[b]){ IRREG[b].forEach(x=>secondary.push(x)); secondary.push('to '+b); } else { regForms(b).forEach(x=>secondary.push(x)); } });
  const menu=[word]; const push=x=>{ if(x && !menu.includes(x)) menu.push(x); };
  extra.forEach(push);                                                    // guaranteed overrides
  primary.sort((a,b)=>a.length-b.length).forEach(x=>{ if(menu.length<8) push(x); });
  secondary.sort((a,b)=>a.length-b.length).forEach(x=>{ if(menu.length<9) push(x); });
  return menu;
}

/* ---------- state ---------- */
const state=PROBLEMS.map(()=>({tryNum:1,attempts:[],solved:false,revealed:false,react:'idle',firstTryWrong:false,placed:[],usedBank:{}}));
let curSet=0, cur=0;
let view='solve'; // 'solve' | 'kkam' | 'comp'

const setTabsEl=document.getElementById('setTabs');
const probRowEl=document.getElementById('probRow');
const stageEl=document.getElementById('stage');
const popRoot=document.getElementById('popRoot');

function gidx(p){return PROBLEMS.indexOf(p);}
function setOf(i){return Math.floor(i/SET_SIZE);}

/* ---------- progress persistence (이어서 하기) ---------- */
const LSKEY='violet_progress_suri_v1';
function saveProgress(){
  try{
    const data={v:1,n:PROBLEMS.length,curSet,cur,state:state.map(s=>({
      tryNum:s.tryNum,attempts:s.attempts,solved:s.solved,revealed:s.revealed,
      react:s.react,firstTryWrong:s.firstTryWrong,placed:s.placed,usedBank:s.usedBank
    }))};
    localStorage.setItem(LSKEY,JSON.stringify(data));
  }catch(e){}
}
function loadProgress(){
  try{
    const raw=localStorage.getItem(LSKEY);if(!raw)return false;
    const d=JSON.parse(raw);if(!d||d.n!==PROBLEMS.length)return false;
    d.state.forEach((s,i)=>{if(state[i])Object.assign(state[i],s);});
    curSet=Math.min(Math.max(d.curSet||0,0),SETS.length-1);
    cur=Math.min(Math.max(d.cur||0,0),PROBLEMS.length-1);
    return state.some(s=>(s.attempts&&s.attempts.length)||s.solved||s.revealed);
  }catch(e){return false;}
}
function resetProgress(){try{localStorage.removeItem(LSKEY);}catch(e){}location.reload();}

/* ---------- nav ---------- */
function setDone(si){return SETS[si].every(p=>{const st=state[gidx(p)];return st.solved||st.revealed;});}
function renderNav(){
  setTabsEl.innerHTML=SETS.map((s,si)=>{
    let cls='set-tab'+(si===curSet?' active':'')+(setDone(si)?' done':'');
    return '<div class="'+cls+'" data-s="'+si+'">'+setName(si)+'</div>';
  }).join('');
  let chips='';
  SETS[curSet].forEach(p=>{
    const i=gidx(p),st=state[i];let cls='nav-chip';
    if(i===cur&&view==='solve')cls+=' active';
    if(st.solved)cls+=' solved';else if(st.revealed)cls+=' opened';
    chips+='<div class="'+cls+'" data-i="'+i+'"><span class="dot"></span><span class="nav-num">'+p.id+'</span></div>';
  });
  const done=setDone(curSet);
  const wrongN=SETS[curSet].filter(p=>state[gidx(p)].firstTryWrong).length;
  const label=done?(wrongN?('📝 오답 깜지 ('+wrongN+')'):'🎉 깜지 없음'):'📝 깜지';
  chips+='<button class="kkam-btn'+(done&&wrongN?' ready':'')+'" id="kkamBtn"'+(done?'':' disabled')+'>'+label+'</button>';
  probRowEl.innerHTML=chips;
  [...setTabsEl.querySelectorAll('.set-tab')].forEach(t=>t.addEventListener('click',()=>{curSet=+t.dataset.s;cur=gidx(SETS[curSet][0]);view='solve';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});}));
  [...probRowEl.querySelectorAll('.nav-chip')].forEach(c=>c.addEventListener('click',()=>{cur=+c.dataset.i;view='solve';renderNav();renderStage();}));
  const kb=document.getElementById('kkamBtn');
  if(kb) kb.addEventListener('click',()=>{ if(!setDone(curSet))return; openKkam(); });
  document.getElementById('pfootSet').textContent='수리고 · '+setName(curSet);
}
