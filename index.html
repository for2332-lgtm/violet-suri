  saveProgress();
  if(view==='kkam'){renderKkam();return;}
  if(view==='comp'){renderComp();return;}
  const p=PROBLEMS[cur],st=state[cur];
  const bankHtml=p.bank.map((w,bi)=>'<span class="w'+(st.usedBank[bi]?' used':'')+'" data-bi="'+bi+'">'+esc(w)+'</span>').join('');
  const condHtml='<ul>'+p.conds.map(c=>'<li>'+c+'</li>').join('')+'</ul>';
  let html=''
   +'<div class="qitem">'
   +'<div class="qhead"><div class="qno">'+p.id+'<small>NO.</small></div><span class="qpoint">'+p.point+'</span></div>'
   +'<div class="qinstr">'+p.instr+'</div>'
   +'<div class="qpassage">'+p.passage+'</div>'
   +(p.summary?'<div class="summary-label">완성할 문장</div><div class="qsummary">'+p.summary+'</div>':'')
   +(p.bank&&p.bank.length?'<div class="sub-label">보기 · Word Bank <span style="color:#C9BBDA;font-weight:400;text-transform:none;letter-spacing:0">— 눌러서 배치</span></div><div class="bank">'+bankHtml+'</div>':'')
   +(p.conds&&p.conds.length?'<div class="sub-label" style="margin-top:14px">조건 · Conditions</div><div class="cond">'+condHtml+'</div>':'')
   +'</div>';

  if(st.attempts.length){
    html+='<div class="log-title">MY REWRITES · 내 시도 기록</div>';
    st.attempts.forEach(a=>{html+='<div class="attempt '+(a.correct?'correct':'wrong')+'"><div class="attempt-head"><span class="try-badge">Attempt '+a.n+'</span><span class="verdict">'+(a.correct?'정답':'다시')+'</span></div><div class="attempt-answer">'+esc(a.text)+'</div><div class="attempt-note">'+a.note+'</div></div>';});
  }
  if(!st.solved&&!st.revealed&&p.hints[st.tryNum]){
    html+='<div class="hintbox"><img class="hint-peek" src="'+sticker('b_07')+'" alt="">💡 <b>Attempt '+st.tryNum+' 힌트</b> &nbsp;'+p.hints[st.tryNum]+'</div>';
  }
  if(st.solved||st.revealed){
    html+=revealHtml(p,st.solved);
  }else if(!p.bank||!p.bank.length){
    // no word bank (free response, e.g. 주제 명사구) — direct text input
    const val=esc(st.placed[0]?st.placed[0].text:'');
    html+='<div class="notezone">'
      +'<span class="note-label">MY SYNTAX NOTE <span>· 직접 입력</span></span>'
      +'<input class="free-input" id="freeInput" placeholder="여기에 답을 입력하세요 (본문 단어 활용)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" writingsuggestions="false" value="'+val+'">'
      +'<img class="note-coffee" src="'+sticker('b_06')+'" alt="">'
      +'<div class="row"><button class="submit" id="submitBtn">제출하기</button><span class="try-count">Attempt <b>'+st.tryNum+'</b> / '+MAX+'</span></div>'
      +'</div>';
  }else{
    const stripCls='answer-strip'+(st.placed.length?'':' empty');
    let toks='';
    st.placed.forEach((t,ti)=>{toks+='<span class="tok'+(t.bankIdx==null?' added':'')+(t.changed?' changed':'')+'" data-ti="'+ti+'">'+esc(t.text)+'<span class="x">×</span></span>';});
    html+='<div class="notezone">'
      +'<span class="note-label">MY SYNTAX NOTE <span>· 답안 배치</span></span>'
      +'<div class="'+stripCls+'" id="strip">'+toks+'<span class="tok-add" id="addTok">＋ 단어</span></div>'
      +'<div class="builder-hint">보기 단어를 <b>탭</b>해 배치 · 배치된 단어를 <b>탭</b>하면 제거 · <b>꾹 누르거나 더블탭</b>하면 형태 변형(-s·-ing·과거형 등) · <b>＋단어</b>로 보기에 없는 단어 추가</div>'
      +'<img class="note-coffee" src="'+sticker('b_06')+'" alt="">'
      +'<div class="row"><button class="submit" id="submitBtn">제출하기</button><span class="try-count">Attempt <b>'+st.tryNum+'</b> / '+MAX+'</span></div>'
      +'</div>';
  }
  const r=REACT[st.react]||REACT.idle;
  html+='<div class="reaction"><img src="'+sticker(r.img)+'" alt="오둥이"><div class="bubble">'+r.msg+'</div></div>';
  stageEl.innerHTML=html;
  wireSolve(p,st);
}

function wireSolve(p,st){
  // bank tap -> place
  [...stageEl.querySelectorAll('.bank .w')].forEach(el=>{
    el.addEventListener('click',()=>{
      const bi=+el.dataset.bi;
      if(st.usedBank[bi]) return;      // already placed (elimination)
      st.usedBank[bi]=true;
      st.placed.push({text:p.bank[bi], base:p.bank[bi], bankIdx:bi, changed:false});
      renderStage();
    });
  });
  // placed token: single tap=remove, long-press OR double-tap=transform
  [...stageEl.querySelectorAll('.tok')].forEach(el=>{
    const ti=+el.dataset.ti;
    let pressTimer=null,longFired=false,clickTimer=null,clicks=0;
    const start=()=>{longFired=false;pressTimer=setTimeout(()=>{longFired=true;openTransform(p,st,ti);},450);};
    const cancel=()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}};
    el.addEventListener('pointerdown',start);
    el.addEventListener('pointerup',cancel);
    el.addEventListener('pointerleave',cancel);
    el.addEventListener('pointercancel',cancel);
    el.addEventListener('click',e=>{
      e.preventDefault();
      if(longFired){longFired=false;return;}   // long-press already handled it
      clicks++;
      if(clicks===1){
        clickTimer=setTimeout(()=>{clicks=0;removeToken(st,ti);renderStage();},260); // wait for possible 2nd tap
      }else{
        clearTimeout(clickTimer);clicks=0;openTransform(p,st,ti); // double tap -> transform
      }
    });
  });
  const add=document.getElementById('addTok');
  if(add) add.addEventListener('click',()=>openAdd(p,st));
  const fi=document.getElementById('freeInput');
  if(fi){
    fi.addEventListener('input',()=>{ st.placed=[{text:fi.value,base:fi.value,bankIdx:null,changed:false}]; saveProgress(); });
    fi.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();submit(p,st);} });
  }
  const btn=document.getElementById('submitBtn');
  if(btn) btn.addEventListener('click',()=>submit(p,st));
  const nb=document.getElementById('nextBtn');
  if(nb) nb.addEventListener('click',()=>{const s=SETS[curSet];const pos=s.indexOf(p);if(pos<s.length-1){cur=gidx(s[pos+1]);renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});}else{if(setDone(curSet))openKkam();}});
}

function removeToken(st,ti){const t=st.placed[ti];if(t&&t.bankIdx!=null)delete st.usedBank[t.bankIdx];st.placed.splice(ti,1);}

function closePop(){popRoot.innerHTML='';}
function openTransform(p,st,ti){
  const t=st.placed[ti];if(!t)return;
  const forms=variantForms(t.base);
  const chips=forms.map(f=>'<span class="f" data-f="'+esc(f)+'">'+esc(f)+'</span>').join('');
  popRoot.innerHTML='<div class="pop-mask" id="mask"><div class="pop">'
    +'<h4>단어 변형</h4><div class="base">'+esc(t.base)+'</div>'
    +'<div class="pop-forms">'+chips+'</div>'
    +'<div class="pop-direct"><input id="dinp" placeholder="직접 입력…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" writingsuggestions="false" value="'+esc(t.text)+'"><button id="dok">적용</button></div>'
    +'<div class="pop-tip">불규칙·특수 형태는 직접 입력하세요. 대소문자는 채점에 영향 없어요.</div>'
    +'<div class="pop-actions"><button class="rm" id="rmBtn">이 단어 제거</button><button class="cl" id="clBtn">닫기</button></div>'
    +'</div></div>';
  document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closePop();});
  [...popRoot.querySelectorAll('.pop-forms .f')].forEach(f=>f.addEventListener('click',()=>{applyForm(st,ti,f.dataset.f);closePop();renderStage();}));
  document.getElementById('dok').addEventListener('click',()=>{const v=document.getElementById('dinp').value.trim();if(v){applyForm(st,ti,v);closePop();renderStage();}});
  document.getElementById('dinp').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v){applyForm(st,ti,v);closePop();renderStage();}}});
  document.getElementById('rmBtn').addEventListener('click',()=>{removeToken(st,ti);closePop();renderStage();});
  document.getElementById('clBtn').addEventListener('click',closePop);
}
function applyForm(st,ti,val){const t=st.placed[ti];if(!t)return;t.text=val;t.changed=(norm(val)!==norm(t.base));}
function openAdd(p,st){
  popRoot.innerHTML='<div class="pop-mask" id="mask"><div class="pop">'
    +'<h4>단어 추가</h4><div class="base" style="font-size:14px;color:#7A6E92">보기에 없는 단어(to, as, who 등)나 필요한 단어를 넣으세요.</div>'
    +'<div class="pop-direct"><input id="ainp" placeholder="단어 입력…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button id="aok">추가</button></div>'
    +'<div class="pop-actions"><span></span><button class="cl" id="clBtn">닫기</button></div>'
    +'</div></div>';
  document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closePop();});
  const doAdd=()=>{const v=document.getElementById('ainp').value.trim();if(v){st.placed.push({text:v,base:v,bankIdx:null,changed:false});closePop();renderStage();}};
  document.getElementById('aok').addEventListener('click',doAdd);
  const ai=document.getElementById('ainp');ai.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();});
  setTimeout(()=>ai.focus(),50);
}

function submit(p,st){
  const fi=document.getElementById('freeInput');
  if(fi){ st.placed=[{text:fi.value,base:fi.value,bankIdx:null,changed:false}]; }
  const raw=st.placed.map(t=>t.text).join(' ').trim();
  if(!raw)return;
  const correct=isCorrect(p,raw);
  let note;
  if(correct){note='✓ 조건을 충족했습니다. 아래 해설을 확인하세요.';}
  else{const miss=findMisses(p,raw);note=(st.tryNum<=2)?'아직 정답이 아닙니다. 조건을 다시 확인하고 고쳐 보세요.':(miss.length?'아직 정답이 아닙니다. 빠지거나 어긋난 부분: '+miss.join(', '):'아직 정답이 아닙니다. 표현을 조금 더 다듬어 보세요.');}
  st.attempts.push({n:st.tryNum,text:raw,correct,note});
  if(st.tryNum===1&&!correct) st.firstTryWrong=true;
  const isLast=st.tryNum>=MAX;
  if(correct){st.solved=true;st.react='correct';}
  else if(isLast){st.revealed=true;st.react='reveal';st.firstTryWrong=true;}
  else{st.tryNum++;st.react=p.hints[st.tryNum]?'hint':'wrong';}
  renderNav();renderStage();
}

function revealHtml(p,solved){
  const solList=p.sol.map(s=>'<p><span class="lab">'+s[0]+'</span>'+s[1]+'</p>').join('');
  const s=SETS[curSet];const pos=s.indexOf(p);
  const nextLabel=pos<s.length-1?'다음 문항 &rarr;':(setDone(curSet)?'회차 마무리 · 깜지 &rarr;':'');
  const nextBtn=nextLabel?'<div class="next-row"><button class="nextbtn" id="nextBtn">'+nextLabel+'</button></div>':'';
  const headImg=solved?sticker('a_00'):sticker('b_14');
  return '<div class="reveal"><div class="reveal-head"><img src="'+headImg+'" alt="">'+(solved?'정답입니다 · 해설':'정답 공개 · 해설')+'</div><div class="reveal-body">'
    +'<div class="gist"><b>글의 요지</b> &nbsp;'+p.gist+'</div>'
    +'<div class="sol-label">모범답안 · Model Answer</div><div class="model-ans">'+esc(p.answer).replace(/\n/g,'<br>')+'</div><div class="model-ko">'+p.answerKo+'</div>'
    +'<div class="sol-label">해설 · Explanation</div><div class="sol-body">'+solList+'</div>'+nextBtn+'</div></div>';
}

/* ---------- 깜지 (handwriting) ---------- */
let kkamCanvases=[];
function openKkam(){view='kkam';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});}
function renderKkam(){
  const wrongs=SETS[curSet].filter(p=>state[gidx(p)].firstTryWrong);
  kkamCanvases=[];
  if(!wrongs.length){
    stageEl.innerHTML='<div class="kkam-wrap"><div class="kkam-head"><span class="t">깜지</span></div>'
      +'<div class="comp-card"><img class="comp-mascot" src="'+sticker('a_00')+'"><div class="comp-stamp">PERFECT</div>'
      +'<div class="comp-line"><b>'+setName(curSet)+'</b> — 1트라이 전부 정답!</div><div class="comp-line">이번 회차는 깜지가 없어요. 잘했어! 🎉</div>'
      +'<div class="kkam-done"><button class="big ghost" id="backBtn">회차로 돌아가기</button></div></div></div>';
    document.getElementById('backBtn').addEventListener('click',()=>{view='solve';cur=gidx(SETS[curSet][0]);renderNav();renderStage();});
    return;
  }
  const savedName=localStorage.getItem('violet_name')||'';
  let html='<div class="kkam-wrap"><div class="kkam-head"><span class="t">오답 깜지</span></div>'
    +'<div class="kkam-sub">'+setName(curSet)+' · 1트라이에 틀린 '+wrongs.length+'문항이야. <b>모범답안을 보고</b> 한글 해석 1번, 영어 정답 10번을 <b>애플펜슬</b>로 써보자. 손으로 써야 손에 남아! ✍️</div>'
    +'<div class="kkam-name"><label>이름</label><input id="nameInp" placeholder="이름(반)" autocomplete="off" autocorrect="off" spellcheck="false" value="'+esc(savedName)+'"><span style="font-size:11.5px;color:#9485AE">완료 화면을 캡처해 숙제방에 제출하면 돼요.</span></div>';
  wrongs.forEach((p,idx)=>{
    html+='<div class="kkam-card">'
      +'<div style="font-weight:700;color:var(--deep);font-size:13px;margin-bottom:7px">문항 '+p.id+' <span style="color:var(--gold)">· '+p.point+'</span></div>'
      +'<div class="kkam-ref"><div class="en">'+esc(p.answer).replace(/\n/g,'<br>')+'</div><div class="ko">'+p.answerKo+'</div></div>'
      +'<div class="kkam-instr">아래 칸에 — <b>1줄</b>: 위 한글 해석 &nbsp;|&nbsp; <b>그 아래 10줄</b>: 영어 정답을 반복해서 쓰세요.</div>'
      +'<div class="kkam-toolbar"><button class="pen on" data-role="pen" data-c="'+idx+'">✏️ 펜</button><button data-role="erase" data-c="'+idx+'">지우개</button><button data-role="clear" data-c="'+idx+'">전체 지우기</button><label style="font-size:11.5px;color:#7A6E92;display:flex;align-items:center;gap:5px;margin-left:6px"><input type="checkbox" data-role="finger" data-c="'+idx+'"> 손가락으로도 쓰기</label><span class="sp">Apple Pencil 권장</span></div>'
      +'<div class="canvas-box"><canvas data-c="'+idx+'"></canvas></div>'
      +'</div>';
  });
  html+='<div class="kkam-done"><button class="big ghost" id="backBtn">회차로</button><button class="big" id="doneBtn">깜지 완료 · 제출 카드 만들기</button></div></div>';
  stageEl.innerHTML=html;
  document.getElementById('nameInp').addEventListener('input',e=>localStorage.setItem('violet_name',e.target.value));
  wrongs.forEach((p,idx)=>setupCanvas(idx));
  document.getElementById('backBtn').addEventListener('click',()=>{view='solve';cur=gidx(SETS[curSet][0]);renderNav();renderStage();});
  document.getElementById('doneBtn').addEventListener('click',()=>{
    const thumbs=[...stageEl.querySelectorAll('canvas[data-c]')].map(cv=>{try{return cv.toDataURL('image/png');}catch(e){return null;}}).filter(Boolean);
    renderComp(wrongs,thumbs);
  });
}

function setupCanvas(idx){
  const cv=stageEl.querySelector('canvas[data-c="'+idx+'"]');
  const box=cv.parentElement;
  const cssW=box.clientWidth;
  const lineH=34, rows=12, padTop=8;         // 1 korean + 10 english + spare
  const cssH=padTop*2+lineH*rows;
  const dpr=window.devicePixelRatio||1;
  cv.style.height=cssH+'px';
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  const st={ctx,cssW,cssH,lineH,strokes:[],cur:null,tool:'pen',finger:false};
  cv._st=st;
  drawGrid(st);
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left),y:(e.clientY-r.top),p:(e.pressure&&e.pressure>0?e.pressure:0.5)};};
  const down=e=>{
    if(e.pointerType==='touch'&&!st.finger) return;      // palm/finger rejection
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    st.cur={tool:st.tool,pts:[pos(e)]};
  };
  const move=e=>{
    if(!st.cur) return; e.preventDefault();
    st.cur.pts.push(pos(e)); drawLast(st);
  };
  const up=e=>{ if(!st.cur)return; st.strokes.push(st.cur); st.cur=null; };
  cv.addEventListener('pointerdown',down);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',up);
  // toolbar
  const card=cv.closest('.kkam-card');
  card.querySelectorAll('[data-role]').forEach(b=>{
    const role=b.dataset.role;
    if(role==='pen') b.addEventListener('click',()=>{st.tool='pen';card.querySelector('[data-role=pen]').classList.add('on');card.querySelector('[data-role=erase]').classList.remove('on');});
    if(role==='erase') b.addEventListener('click',()=>{st.tool='erase';b.classList.add('on');card.querySelector('[data-role=pen]').classList.remove('on');});
    if(role==='clear') b.addEventListener('click',()=>{st.strokes=[];st.cur=null;drawGrid(st);});
    if(role==='finger') b.addEventListener('change',e=>{st.finger=e.target.checked;});
  });
}
function drawGrid(st){
  const {ctx,cssW,cssH,lineH}=st;
  ctx.clearRect(0,0,cssW,cssH);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cssW,cssH);
  ctx.strokeStyle='#ECE3F4';ctx.lineWidth=1;
  for(let y=8+lineH;y<cssH;y+=lineH){ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(cssW-10,y);ctx.stroke();}
  // first line marker (korean)
  ctx.fillStyle='#C9BBDA';ctx.font='11px sans-serif';
  ctx.fillText('한글 해석 1번',12,8+lineH-6);
  ctx.fillText('영어 정답 10번 ↓',12,8+lineH*2-6);
}
function redraw(st){ drawGrid(st); st.strokes.forEach(s=>drawStroke(st,s)); }
function drawStroke(st,s){
  const {ctx}=st;
  if(s.tool==='erase'){ctx.strokeStyle='#fff';ctx.lineWidth=22;}
  else{ctx.strokeStyle='#3a2f55';}
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=1;i<s.pts.length;i++){
    const a=s.pts[i-1],b=s.pts[i];
    ctx.lineWidth=s.tool==='erase'?22:Math.max(1.4,b.p*3.2);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
}
function drawLast(st){ // draw only the newest segment for perf; erase needs full redraw
  const s=st.cur; if(!s||s.pts.length<2)return;
  if(s.tool==='erase'){ st.strokes.push(s); redraw(st); st.strokes.pop(); return; }
  const {ctx}=st;const a=s.pts[s.pts.length-2],b=s.pts[s.pts.length-1];
  ctx.strokeStyle='#3a2f55';ctx.lineCap='round';ctx.lineJoin='round';
  ctx.lineWidth=Math.max(1.4,b.p*3.2);
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}

/* ---------- completion card ---------- */
function renderComp(wrongs,thumbs){
  wrongs=wrongs||SETS[curSet].filter(p=>state[gidx(p)].firstTryWrong);
  thumbs=thumbs||[];
  view='comp';
  const name=localStorage.getItem('violet_name')||'(이름 미입력)';
  const d=new Date();

    +'<div class="comp-line"><b>'+esc(name)+'</b></div>'
    +'<div class="comp-line">'+setName(curSet)+' · '+dateStr+'</div>'
    +'<div class="comp-line">오답 문항: '+wrongs.map(p=>p.id+'번').join(', ')+' &nbsp;(각 한글1·영어10 완료)</div>'
    +(thumbs.length?'<div class="comp-thumbs">'+thumbs.map(t=>'<img src="'+t+'">').join('')+'</div>':'')
    +'<div class="comp-shot">📸 이 화면을 캡처해서 숙제방에 제출하세요!</div>'
    +'<div class="kkam-done"><button class="big ghost" id="backBtn2">회차로</button></div></div>';
  stageEl.innerHTML=html;
  document.getElementById('backBtn2').addEventListener('click',()=>{view='solve';cur=gidx(SETS[curSet][0]);renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});});
  window.scrollTo({top:0,behavior:'smooth'});
}
/* resume toast + reset */
function showResume(){
  const t=document.createElement('div');t.className='resume-toast';
  t.innerHTML='↩️ 지난 진행을 불러왔어요 · <b>'+setName(curSet)+' '+PROBLEMS[cur].id+'번</b>부터 이어서';
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'),50);
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},4200);
}
function wireReset(){
  const r=document.getElementById('resetBtn');
  if(r) r.addEventListener('click',()=>{ if(confirm('지금까지의 진행 상황을 모두 지우고 처음부터 다시 시작할까요?')) resetProgress(); });
}

/* boot */
const _restored=loadProgress();
renderNav();renderStage();wireReset();
if(_restored) showResume();
